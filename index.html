    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:"Segoe UI",Arial,sans-serif;
      color:#fff;
      background:
        linear-gradient(180deg,rgba(4,15,32,.42),rgba(4,15,32,.92)),
        var(--hero-bg-url, var(--hero-home-img)) center center/cover fixed no-repeat;
      padding:0 16px 38px;
      transition:background-image .5s ease;
      overflow-x:hidden;
    }

    /* ===== HERO / kolase foto — HANYA dipakai di halaman detail (SIMBG & PPBL) ===== */
    .hero-wrap{
      position:relative;
      width:min(1100px,100%);
      height:clamp(230px,42vw,540px);
      margin:0 auto;
    }

    .hero{
      position:absolute;
      inset:0;
      border-radius:0 0 28px 28px;
      overflow:hidden;
      box-shadow:0 16px 45px rgba(0,0,0,.30);
      background:
        linear-gradient(180deg,rgba(7,27,58,.05),rgba(7,27,58,.35)),
        var(--hero-bg-url) center center/cover no-repeat;
      opacity:1;
      transition:opacity .55s ease, background-image .1s linear;
    }

    /* Halaman Home: TIDAK pakai hero/banner foto sama sekali — cukup
       background halaman (satu gambar) + logo saja. Hero hanya muncul
       di halaman detail (SIMBG / PPBL). */
    body.home-mode .hero-wrap{
      display:none;
    }
    body.home-mode .view-wrap{
      margin-top:32px;
    }

    /* ===== Wrapper kartu (Home & Detail) ===== */
    .view-wrap{
      width:100%;
      max-width:480px;
      margin:-36px auto 0;
      position:relative;
      z-index:2;
      transition:margin-top .3s ease;
    }

    .card{
      position:relative;
      text-align:center;
      padding:28px 20px 20px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:24px;
      background:rgba(7,27,58,.88);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 45px rgba(0,0,0,.35);
      overflow:visible;
      animation:fadeIn .35s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(6px)}
      to{opacity:1; transform:translateY(0)}
    }

    /* ===== Logo tunggal (lingkaran, dipakai di halaman detail) ===== */
    .logo-wrap{
      width:96px;
      height:96px;
      margin:-24px auto 10px;
      border-radius:50%;
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 8px 18px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.12);
      flex-shrink:0;
    }

    /* ===== Logo Home: pil memanjang, sesuai bentuk asli logo KENDATI
       (aspect ratio ~4.5:1) — bukan lingkaran, supaya logo tidak
       terpotong/mengecil aneh di dalam bulatan kecil. ===== */
    .logo-wrap.pill{
      width:min(320px, 82%);
      height:auto;
      aspect-ratio:4.5 / 1;
      margin:-30px auto 12px;
      border-radius:999px;
      background:var(--cream);
      padding:8px 14px;
    }
    .logo-wrap.pill .logo{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .logo{
      width:82%;
      height:82%;
      object-fit:contain;
      display:block;
    }

    h1{
      color:#ffd873;
      font-size:21px;
      margin:8px 0 6px;
    }

    .subtitle{
      color:#eaf1ff;
      font-size:13.5px;
      line-height:1.55;
      margin:0 0 22px;
      opacity:.94;
    }

    footer{
      margin-top:18px;
      color:rgba(255,255,255,.62);
      font-size:11.5px;
    }

    /* ===== Tombol kembali (halaman detail) =====
       Diletakkan mengambang (absolute) di pojok kiri atas kartu,
       BUKAN sebagai blok yang mendorong logo ke bawah — supaya logo
       tetap di tengah, tombol cuma nempel di pinggir. */
    .back-btn{
      position:absolute;
      top:16px;
      left:16px;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      width:36px;
      height:36px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.35);
      color:#eaf1ff;
      font-size:16px;
      border-radius:50%;
      cursor:pointer;
      transition:background .18s ease, transform .18s ease;
    }
    .back-btn:hover{background:rgba(255,255,255,.22); transform:translateX(-2px)}

    /* ===== HONEYCOMB GRID (meniru teknik asli Kedaton di main1.css) =====
       Kedaton memakai hexagon pointy-top dengan rasio lebar:tinggi =
       1 : 1.1547 (height = width / (√3/2)), lalu:
         - baris genap digeser ke kanan sejauh SETENGAH lebar hex
         - tiap baris ditumpuk naik sejauh 3/4 TINGGI hex
       Itulah rumus matematis honeycomb asli, bukan margin kira-kira.
       Semua posisi (left/top per item) dihitung & ditulis oleh JS
       (lihat layoutHoneycomb()) berdasarkan rumus yang sama, supaya
       tetap presisi di berbagai lebar layar / jumlah item — bukan
       di-hardcode ke nth-child seperti punya Kedaton yang rawan pecah
       kalau container-nya berubah lebar. ===== */
    .hex-grid{
      position:relative;
      margin:6px auto 10px;
    }

    .hex-item{
      appearance:none;
      background:none;
      border:none;
      padding:0;
      position:absolute;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:inherit;
      font:inherit;
      text-decoration:none;
      cursor:pointer;
      z-index:1;
      transition:transform .2s cubic-bezier(.165,.84,.44,1), z-index 0s;
    }
    .hex-item:focus-visible{
      outline:2px solid var(--gold);
      outline-offset:3px;
    }
    .hex-item:hover{
      transform:scale(1.08);
      z-index:2;
    }

    /* bentuk hex pointy-top asli (titik di atas & bawah, sisi rata
       kiri-kanan) via clip-path — setara dengan polygon SVG Kedaton
       (86.6,0 173.2,50 173.2,150 86.6,200 0,150 0,50) hanya diskalakan
       ke 0-100 */
    .hex-shape{
      position:absolute;
      inset:0;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(0,0,0,.35);
      transition:box-shadow .2s ease, background .2s ease;
    }
    .hex-item:hover .hex-shape{
      box-shadow:0 14px 28px rgba(0,0,0,.5);
    }

    .hex-shape img{
      width:46%;
      height:46%;
      object-fit:contain;
      display:block;
    }

    .hex-icon{
      font-size:26px;
      line-height:1;
    }

    .hex-label{
      position:relative;
      z-index:1;
      margin-top:6px;
      font-size:10.5px;
      font-weight:700;
      color:var(--blue);
      line-height:1.2;
      text-align:center;
      padding:0 6px;
      transition:color .2s ease;
    }
    /* saat hover, label ganti warna seperti .hex-content:hover Kedaton
       (dari #c77f37 jadi #038987) — di sini dari biru ke emas */
    .hex-item:hover .hex-label{
      color:var(--gold);
    }

    .music-btn{
      position:fixed;
      top:16px;
      right:16px;
      width:46px;
      height:46px;
      border-radius:50%;
      background:rgba(246,243,234,.96);
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:999;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
    }

    .music-btn:hover{transform:scale(1.05)}
    .music-btn svg{width:20px;height:20px;fill:#0a1628}
    .music-btn.playing{animation:pulse 1.5s infinite ease-in-out}

    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,.45)}
      50%{box-shadow:0 0 0 8px rgba(240,180,41,0)}
    }

    /* ===== Badge penghitung pengunjung (tersimpan permanen di Supabase) ===== */
    .visitor-counter{
      position:fixed;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:7px;
      background:rgba(246,243,234,.96);
      color:var(--text);
      font-weight:700;
      font-size:12.5px;
      padding:9px 15px 9px 12px;
      border-radius:999px;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
      z-index:999;
      border-left:3px solid var(--gold);
      white-space:nowrap;
      cursor:pointer;
      border-top:none;border-right:none;border-bottom:none;
      user-select:none;
    }
    .visitor-counter:hover{background:#fff}
    .visitor-counter .v-icon{font-size:14px;flex:0 0 auto}
    .visitor-counter .v-label{opacity:.7;font-weight:600}
    .visitor-counter .v-count{color:var(--blue);font-weight:800}
    .visitor-counter .v-caret{opacity:.55;font-size:10px;margin-left:1px;transition:transform .2s ease}
    .visitor-counter.open .v-caret{transform:rotate(180deg)}

    /* ===== Panel rincian pengunjung (harian / bulanan) ===== */
    .visitor-panel{
      position:fixed;
      top:66px;
      left:16px;
      width:236px;
      max-height:0;
      opacity:0;
      overflow:hidden;
      background:rgba(246,243,234,.98);
      color:var(--text);
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.32);
      z-index:998;
      transition:max-height .25s ease, opacity .2s ease, padding .25s ease;
      padding:0 14px;
    }
    .visitor-panel.open{
      max-height:400px;
      opacity:1;
      padding:12px 14px 14px;
    }
    .visitor-panel-head{
      font-size:12.5px;
      font-weight:800;
      color:var(--blue);
      margin-bottom:8px;
      padding-bottom:6px;
      border-bottom:1px solid rgba(11,75,145,.18);
    }
    .visitor-panel-total{font-size:12px;margin-bottom:8px;opacity:.85}
    .visitor-panel-total b{color:var(--blue)}

    .visitor-tabs{
      display:flex;
      gap:6px;
      margin-bottom:8px;
    }
    .v-tab{
      flex:1;
      font-size:11px;
      font-weight:700;
      padding:6px 0;
      border-radius:8px;
      border:1px solid rgba(11,75,145,.28);
      background:transparent;
      color:var(--blue);
      cursor:pointer;
      transition:background .15s ease, color .15s ease;
    }
    .v-tab.active{
      background:var(--blue);
      color:#fff;
      border-color:var(--blue);
    }

    .visitor-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
    .visitor-table th{
      text-align:left;
      font-size:10.5px;
      text-transform:uppercase;
      letter-spacing:.4px;
      opacity:.6;
      padding:3px 0;
    }
    .visitor-table td{padding:4px 0;border-top:1px dashed rgba(16,33,59,.12)}
    .visitor-table td:last-child{text-align:right;font-weight:700;color:var(--blue)}

    @media (max-width:600px){
      body{
        padding:0 10px 28px;
        background-attachment:scroll;
      }

      .hero{
        height:240px;
        border-radius:0 0 22px 22px;
      }
      .hero-wrap{height:240px}

      .card{
        padding:22px 15px 16px;
        border-radius:20px;
      }
      .view-wrap{margin:-26px auto 0}

      .logo-wrap{
        width:84px;
        height:84px;
        margin:-20px auto 8px;
      }
      .logo-wrap.pill{
        margin:-24px auto 10px;
      }

      h1{font-size:19px}
      .subtitle{font-size:13px}
      .music-btn{top:12px;right:12px}
      .visitor-counter{top:12px;left:12px;font-size:11.5px;padding:7px 12px 7px 10px}
      .visitor-panel{top:58px;left:12px;width:min(236px,calc(100vw - 24px))}

      .hex-icon{font-size:20px}
      .hex-label{font-size:9.5px}
    }
  </style>
</head>

<body class="home-mode">

  <div class="hero-wrap">
    <div class="hero" id="hero" aria-label="Kolase dokumentasi kegiatan"></div>
  </div>

  <!-- Musik: id="bgMusic" src akan diganti otomatis sesuai halaman aktif -->
  <audio id="bgMusic" loop preload="none"></audio>

  <button class="music-btn" id="musicBtn"
          title="Putar musik" aria-label="Putar atau jeda musik">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none">
      <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
    </svg>
  </button>

  <!-- Badge total pengunjung: nilainya tersimpan permanen di Supabase (server),
       sama untuk semua orang, dan klik badge ini untuk buka rinciannya -->
  <div class="visitor-counter" id="visitorCounter" title="Klik untuk lihat rincian">
    <span class="v-icon">👁️</span>

  // ================== HONEYCOMB — rumus persis teknik Kedaton ==================
  // Kedaton pakai hex pointy-top dgn rasio W:H = 1 : 1.1547 (H = W / (√3/2)).
  // Packing pointy-top hexagon yang saling bertautan sempurna:
  //   - jarak antar kolom (searah baris)      = W (lebar hex, sisi rata bersentuhan)
  //   - jarak antar baris (vertikal)          = H * 0.75
  //   - baris ganjil (index 1,3,5,...) digeser = W / 2 ke kanan
  // Ini dihitung ulang tiap kali grid dibangun (bukan hardcode nth-child)
  // supaya tetap presisi walau jumlah item atau lebar layar berubah.

  function chunkIntoRows(items, perRow){
    const rows = [];
    for (let i = 0; i < items.length; i += perRow){
      rows.push(items.slice(i, i + perRow));
    }
    return rows;
  }

  // Hitung lebar hex (W) otomatis dari lebar container yang tersedia,
  // supaya perRow hex selalu muat rapat tanpa overflow di layar manapun.
  function computeHexWidth(containerEl, perRow){
    const available = containerEl.clientWidth || 300;
    // total lebar grid = perRow*W + W/2  ->  W = available / (perRow + 0.5)
    const w = available / (perRow + 0.5);
    return Math.max(58, Math.min(112, Math.floor(w)));
  }

  function layoutHoneycomb(containerEl, items, itemHtmlFn, perRow){
    const hexW = computeHexWidth(containerEl, perRow);
    const hexH = hexW / (Math.sqrt(3) / 2);   // rasio asli Kedaton: H = W / (√3/2)
    const colStep = hexW;                     // jarak antar kolom dalam 1 baris
    const rowStep = hexH * 0.75;              // baris ditumpuk naik 3/4 tinggi hex
    const offsetX = hexW / 2;                 // baris ganjil digeser setengah lebar

    const rows = chunkIntoRows(items, perRow);
    const hasOffsetRow = rows.length > 1;     // cuma ada geseran kalau lebih dari 1 baris

    // Lebar total = lebar baris terlebar (baris genap TANPA offset dianggap
    // mulai dari 0; baris ganjil DENGAN offset berakhir di offsetX + lebarnya).
    // Kalau cuma 1 baris, tidak ada offset sama sekali -> grid presisi
    // selebar isinya saja, supaya margin:auto benar-benar menengahkannya.
    let totalWidth = 0;
    rows.forEach((row, r) => {
      const rowOffset = (hasOffsetRow && r % 2 === 1) ? offsetX : 0;
      const rowWidth = row.length * colStep + rowOffset;
      if (rowWidth > totalWidth) totalWidth = rowWidth;
    });
    const totalHeight = (rows.length - 1) * rowStep + hexH;

    containerEl.style.width = totalWidth + "px";
    containerEl.style.height = totalHeight + "px";

    containerEl.innerHTML = rows.map((row, r) => row.map((item, c) => {
      const x = c * colStep + (hasOffsetRow && r % 2 === 1 ? offsetX : 0);
      const y = r * rowStep;
      return itemHtmlFn(item, x, y, hexW, hexH);
    }).join("")).join("");
  }

  // ---- Hexagon pilihan layanan (halaman Home) ----
  function buildHexGrid(){
    const perRow = Math.min(3, segments.length) || 1;
    layoutHoneycomb(hexGrid, segments, (seg, x, y, w, h) => `
      <button class="hex-item" type="button" data-id="${seg.id}" aria-label="Buka ${seg.hexLabel}"
              style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
        <span class="hex-shape"><img src="${seg.logo}" alt="Logo ${seg.hexLabel}"></span>
        <span class="hex-label">${seg.hexLabel}</span>
      </button>
    `, perRow);

    hexGrid.querySelectorAll(".hex-item").forEach(btn => {
      btn.addEventListener("click", () => openSegment(btn.dataset.id));
    });
  }

  // ---- Hexagon daftar link (halaman Detail) ----
  function buildLinkHexGrid(seg){
    const perRow = seg.links.length <= 4 ? 2 : 3;
    layoutHoneycomb(detailLinks, seg.links, (l, x, y, w, h) => `
      <a class="hex-item" href="${l.href}" target="_blank" rel="noopener" aria-label="${l.label}"
         style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
        <span class="hex-shape"><span class="hex-icon">${l.icon}</span></span>
        <span class="hex-label">${l.label}</span>
      </a>
    `, perRow);
  }

  // Bangun ulang grid yang sedang tampil saat layar diresize, supaya
  // tetap presisi rapat (lebar hex dihitung ulang dari lebar container).
  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentSegment) buildLinkHexGrid(currentSegment);
      else buildHexGrid();
    }, 150);
  });

  function openSegment(id){
    const seg = segments.find(s => s.id === id);
    if (!seg) return;
    currentSegment = seg;

    detailLogo.src = seg.logo;
    detailLogo.alt = "Logo " + seg.hexLabel;
    detailTitle.textContent = seg.title;
    detailSubtitle.textContent = seg.subtitle;
    detailFooter.textContent = seg.footer;
    buildLinkHexGrid(seg);

    document.body.classList.remove("home-mode"); // hero (format kolase) tampil hanya di halaman detail
    setHero(seg.hero);
    switchAudio(seg.audio);

    homeView.style.display = "none";
    detailView.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goHome(){
    currentSegment = null;
    homeView.style.display = "block";
    detailView.style.display = "none";
    document.body.classList.add("home-mode"); // Home: tanpa hero, cuma background + logo
    document.body.style.removeProperty("--hero-bg-url"); // pastikan balik ke background home
    switchAudio(HOME.audio);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  backBtn.addEventListener("click", goHome);

  buildHexGrid();
  // Home dimulai tanpa hero (lihat body.home-mode) — hero (kolase foto)
  // baru muncul saat openSegment() dipanggil ketika pengguna membuka
  // salah satu layanan (SIMBG / PPBL).

  // ================== MUSIK: interaksi tombol & autoplay ==================
  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (bgMusic.paused) {
      if (!bgMusic.getAttribute("src")) bgMusic.setAttribute("src", (currentSegment || HOME).audio);
      bgMusic.play().then(showPlayingUI).catch(showPausedUI);
    } else {
      bgMusic.pause();
      showPausedUI();
    }
  });

  // Autoplay saat pengguna pertama kali mengklik area mana saja di halaman
  document.addEventListener("click", () => {
    if (bgMusic.paused) {
      if (!bgMusic.getAttribute("src")) bgMusic.setAttribute("src", (currentSegment || HOME).audio);
      bgMusic.play().then(showPlayingUI).catch(() => {});
    }
  }, { once: true });

  // ================== PENGHITUNG & REKAP PENGUNJUNG — HARIAN & BULANAN (Supabase) ==================
  // Setiap kunjungan dicatat lewat 1 pemanggilan fungsi database (RPC) yang atomik:
  // dalam SATU eksekusi yang sama, +1 ke "total sepanjang waktu", +1 ke "hari ini",
  // DAN +1 ke "bulan ini". Tidak ada logika "unique visitor per sesi" seperti
  // analytics tool (GoatCounter dkk) — ini murni angka mentah, jadi dijamin:
  // total selalu = jumlah semua angka harian = jumlah semua angka bulanan.
  //
  // WAJIB DIISI — cuma 2 nilai, ambil dari dashboard Supabase-mu:
  //   Project Settings (ikon gerigi) -> API -> "Project URL" dan "anon public" key.
  const SUPABASE_URL = "https://kvcnbyasnvpmnrbvkjjg.supabase.co";      // contoh: https://xxxxx.supabase.co
  const SUPABASE_ANON_KEY = "sb_publishable_J9EFLRjCWE9gaLgsQLKeLQ_x-Wwu3wF";       // key panjang, aman dipasang di frontend

  // WAJIB DIJALANKAN di Supabase -> menu "SQL Editor" -> New query -> paste
  // semua isi blok SQL di bawah ini -> klik Run. (Ini komentar, bukan kode JS yang jalan.)
  // Kalau kamu SUDAH pernah menjalankan versi SQL sebelumnya (yang cuma total & harian),
  // tinggal jalankan blok ini lagi — tabel lama dibiarkan (create table if not exists),
  // dan fungsi record_visit() akan DIGANTI (create or replace) supaya ikut mencatat bulanan.
  /*
    create table if not exists visit_total (
      id int primary key default 1,
      count bigint not null default 0
    );
    insert into visit_total (id, count) values (1, 0)
      on conflict (id) do nothing;

    create table if not exists visit_daily (
      day date primary key,
      count bigint not null default 0
    );

    create table if not exists visit_monthly (
      month date primary key,       -- disimpan sebagai tanggal 1 tiap bulan, mis. 2026-09-01
      count bigint not null default 0
    );

    create or replace function record_visit()
    returns void
    language plpgsql
    security definer
    as $$
    begin
      update visit_total set count = count + 1 where id = 1;

      insert into visit_daily (day, count) values (current_date, 1)
        on conflict (day) do update set count = visit_daily.count + 1;

      insert into visit_monthly (month, count)
        values (date_trunc('month', current_date)::date, 1)
        on conflict (month) do update set count = visit_monthly.count + 1;
    end;
    $$;

    alter table visit_total enable row level security;
    alter table visit_daily enable row level security;
    alter table visit_monthly enable row level security;

    drop policy if exists "publik boleh baca total" on visit_total;
    create policy "publik boleh baca total" on visit_total for select using (true);

    drop policy if exists "publik boleh baca harian" on visit_daily;
    create policy "publik boleh baca harian" on visit_daily for select using (true);

    drop policy if exists "publik boleh baca bulanan" on visit_monthly;
    create policy "publik boleh baca bulanan" on visit_monthly for select using (true);
    -- catatan: publik TIDAK diberi izin insert/update langsung ke tabel manapun;
    -- satu-satunya jalan menambah angka adalah lewat fungsi record_visit() di atas,
    -- dan fungsi ini SELALU menambah total, harian, & bulanan bersamaan.
  */

  const HARI_DITAMPILKAN = 7;   // jumlah hari ke belakang yang direkap
  const BULAN_DITAMPILKAN = 6; // jumlah bulan ke belakang yang direkap

  function formatTanggalID(isoDate){
    const [y, m, d] = isoDate.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }

  function formatBulanID(isoMonth){
    const [y, m] = isoMonth.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  }

  (function initVisitorBadge(){
    const countEl = document.getElementById("visitorCount");
    const totalDetailEl = document.getElementById("visitorTotalDetail");
    const tableBody = document.getElementById("visitorTableBody");
    const colHead = document.getElementById("visitorColHead");
    const counterBtn = document.getElementById("visitorCounter");
    const panel = document.getElementById("visitorPanel");
    const tabDaily = document.getElementById("tabDaily");
    const tabMonthly = document.getElementById("tabMonthly");

    // Panel bisa dibuka/tutup lewat klik badge, terlepas dari Supabase siap atau belum
    counterBtn.addEventListener("click", () => {
      counterBtn.classList.toggle("open");
      panel.classList.toggle("open");
    });

    let activeTab = "daily";
    let dailyRows = [];
    let monthlyRows = [];

    function renderTable(){
      if (activeTab === "daily"){
        colHead.textContent = "Tanggal";
        tableBody.innerHTML = dailyRows.length
          ? dailyRows.map(row => `
              <tr>
                <td>${formatTanggalID(row.day)}${row.day === todayKey ? " (hari ini)" : ""}</td>
                <td>${Number(row.count).toLocaleString("id-ID")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="2">Belum ada data</td></tr>';
      } else {
        colHead.textContent = "Bulan";
        tableBody.innerHTML = monthlyRows.length
          ? monthlyRows.map(row => `
              <tr>
                <td>${formatBulanID(row.month)}</td>
                <td>${Number(row.count).toLocaleString("id-ID")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="2">Belum ada data</td></tr>';
      }
    }

    function setActiveTab(tab){
      activeTab = tab;
      tabDaily.classList.toggle("active", tab === "daily");
      tabMonthly.classList.toggle("active", tab === "monthly");
      renderTable();
    }

    tabDaily.addEventListener("click", () => setActiveTab("daily"));
    tabMonthly.addEventListener("click", () => setActiveTab("monthly"));

    const isConfigured = !SUPABASE_URL.startsWith("GANTI_") && !SUPABASE_ANON_KEY.startsWith("GANTI_");
    if (!isConfigured){
      countEl.textContent = "-";
      if (totalDetailEl) totalDetailEl.textContent = "-";
      tableBody.innerHTML = '<tr><td colspan="2">SUPABASE_URL / KEY belum diisi</td></tr>';
      console.error("Isi dulu SUPABASE_URL dan SUPABASE_ANON_KEY di kode sebelum badge pengunjung bisa jalan.");
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const todayKey = new Date().toLocaleDateString("sv-SE"); // format YYYY-MM-DD lokal

    async function fetchTotal(){
      const { data, error } = await sb.from("visit_total").select("count").eq("id", 1).single();
      if (error) console.error("Supabase (visit_total):", error.message);
      const total = (!error && data) ? data.count : "-";
      countEl.textContent = (typeof total === "number") ? total.toLocaleString("id-ID") : total;
      if (totalDetailEl) totalDetailEl.textContent = countEl.textContent;
    }

    async function fetchDailyRecap(){
      const { data, error } = await sb
        .from("visit_daily")
        .select("day, count")
        .order("day", { ascending: false })
        .limit(HARI_DITAMPILKAN);

      if (error) console.error("Supabase (visit_daily):", error.message);
      dailyRows = (!error && data) ? data : [];
      renderTable();
    }

    async function fetchMonthlyRecap(){
      const { data, error } = await sb
        .from("visit_monthly")
        .select("month, count")
        .order("month", { ascending: false })
        .limit(BULAN_DITAMPILKAN);

      if (error) console.error("Supabase (visit_monthly):", error.message, "— pastikan sudah menjalankan SQL setup tabel visit_monthly.");
      monthlyRows = (!error && data) ? data : [];
      renderTable();
    }

    async function recordAndLoad(){
      const { error } = await sb.rpc("record_visit"); // +1 total, +1 harian, +1 bulanan — 1 transaksi database
      if (error) console.error("Supabase (record_visit):", error.message, "— pastikan sudah menjalankan SQL setup di SQL Editor.");
      await fetchTotal();
      await fetchDailyRecap();
      await fetchMonthlyRecap();
    }

    recordAndLoad();
  })();
</script>
