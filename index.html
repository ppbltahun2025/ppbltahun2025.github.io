<!doctype html>
<html lang="id" class="home-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b3a">
  <meta name="description" content="Daftar link serbaguna SIMBG DAN PPBL Gresik.">
  <title>KENDATI</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2710424249080203"
     crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-2710424249080203">

  <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>
  <!-- Favicon (logo tab browser) -->
  <link rel="icon" type="image/png" href="assets/icon-menu.png">
  <link rel="apple-touch-icon" href="assets/icon-menu.png">

  <style>
    :root{
      /* ============================================================
         PENTING: GANTI baris --hero-home-img di bawah dengan baris
         ASLI milikmu (url("data:image/svg+xml;base64,....") yang
         panjang itu). Saya tidak menyalin base64 raksasa tersebut
         supaya tidak ada karakter yang rusak. Selama belum diganti,
         background halaman hanya gradasi biru gelap.
         ============================================================ */
      --hero-home-img: none;
      --navy:#071b3a;
      --blue:#0b4b91;
      --gold:#f0b429;
      --cream:#f6f3ea;
      --text:#10213b;
    }

    *{box-sizing:border-box}

    html{ height:100%; }

    body{
      margin:0;
      min-height:100vh;
      font-family:"Segoe UI",Arial,sans-serif;
      color:#fff;
      background:
        linear-gradient(180deg,rgba(4,15,32,.42),rgba(4,15,32,.92)),
        var(--hero-bg-url, var(--hero-home-img)) center center/cover fixed no-repeat;
      padding:0 16px 38px;
      transition:background-image .5s ease;
      overflow-x:hidden;
    }

    /* ===== Halaman Home: dikunci pas 1 layar penuh, TIDAK PERNAH scroll,
       di zoom berapa pun. Kalau kepanjangan, JS (fitHomeToViewport)
       menyusutkannya (transform:scale) supaya tetap muat. ===== */
    html.home-mode, body.home-mode{
      height:100%;
      overflow:hidden;
    }
    body.home-mode{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px 16px;
    }

    /* ===== Halaman Detail: kartu di ATAS, foto hero di BAWAH ===== */
    body:not(.home-mode){
      display:flex;
      flex-direction:column;
    }
    body:not(.home-mode) .view-wrap{
      order:1;
      margin:20px auto 0;
    }
    body:not(.home-mode) .hero-wrap{
      order:2;
      margin:18px auto 0;
    }
    body:not(.home-mode) .logo-wrap:not(.pill){
      margin-top:0;
    }

    /* ===== HERO / kolase foto — HANYA di halaman detail ===== */
    .hero-wrap{
      position:relative;
      width:min(1100px,100%);
      height:clamp(230px,42vw,540px);
      margin:0 auto;
    }

    .hero{
      position:absolute;
      inset:0;
      border-radius:0 0 28px 28px;
      overflow:hidden;
      box-shadow:0 16px 45px rgba(0,0,0,.30);
      background:
        linear-gradient(180deg,rgba(7,27,58,.05),rgba(7,27,58,.35)),
        var(--hero-bg-url) center center/cover no-repeat;
      opacity:1;
      transition:opacity .55s ease, background-image .1s linear;
    }

    body.home-mode .hero-wrap{
      display:none;
    }

    /* ===== Kartu Home: lebar dibatasi selebar logo KENDATI
       supaya latar animasi terlihat jelas di kiri & kanan ===== */
    body.home-mode .view-wrap{
      margin:0 auto;
      max-width:380px;   /* selebar logo KENDATI; ubah angka ini untuk menyesuaikan */
      max-height:100%;
    }
    body.home-mode .logo-wrap.pill{
      width:100%;        /* logo pil mengisi lebar kartu */
    }

    /* ===== Wrapper kartu (Home & Detail) ===== */
    .view-wrap{
      width:100%;
      max-width:480px;
      margin:-36px auto 0;
      position:relative;
      z-index:2;
      transition:margin-top .3s ease;
    }

    .card{
      position:relative;
      text-align:center;
      padding:28px 20px 20px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:24px;
      background:rgba(7,27,58,.88);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 45px rgba(0,0,0,.35);
      overflow:visible;
      animation:fadeIn .35s ease;
    }

    /* Jarak atas kartu Home = jarak copyright ke tepi bawah */
    #homeView{
      padding-top:28px;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(6px)}
      to{opacity:1; transform:translateY(0)}
    }

    /* ===== Latar Home: HANYA foto slideshow dari assets/background ===== */
    body.home-mode{background:#061631}

    /* ===== ORB: logo lingkaran di tengah layar.
       Posisi & ukuran TIDAK PERNAH berubah, baik saat menu tertutup
       maupun terbuka. Klik 1x = buka, klik 1x lagi = tutup. ===== */
    .home-orb{
      position:fixed;
      top:50%; left:50%;
      width:112px; height:112px;
      margin:-56px 0 0 -56px;
      padding:0;
      border:none;
      border-radius:50%;
      background:var(--cream);
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:5;
      box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 5px rgba(255,255,255,.18);
      transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease, box-shadow .3s ease;
    }
    body.home-mode .home-orb{display:flex}
    .home-orb img{width:76%; height:76%; object-fit:contain; pointer-events:none}
    .home-orb::before{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:2px solid rgba(240,180,41,.6);
      animation:hubPulse 2.4s ease-out infinite;
    }
    .home-orb:hover{
      transform:scale(1.08);
      box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 5px rgba(240,180,41,.6);
    }
    /* orb TETAP tampil di tengah layar saat menu terbuka */
    body.home-open .home-orb::before{animation:none; opacity:0}
    body.home-open .home-orb{
      box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 5px rgba(240,180,41,.6);
    }

    /* ===== Kartu Home: biru TRANSPARAN, mekar dari orb ===== */
    #homeView{
      background:rgba(7,27,58,.42);
      -webkit-backdrop-filter:blur(10px);
      backdrop-filter:blur(10px);
      border-color:rgba(255,255,255,.28);
      animation:none;
      transform-origin:center center;
      transition:transform .7s cubic-bezier(.22,1,.36,1), opacity .45s ease, border-radius .7s ease, visibility 0s linear 0s;
    }
    #homeView.closed{
      transform:scale(.1);
      opacity:0;
      border-radius:50%;
      visibility:hidden;
      pointer-events:none;
      transition:transform .5s cubic-bezier(.55,0,.55,.2), opacity .35s ease .1s, border-radius .5s ease, visibility 0s linear .55s;
    }
    #homeView > *{transition:opacity .45s ease .3s}
    #homeView.closed > *{opacity:0; transition:opacity .15s ease}
    #homeView h1,
    #homeView .subtitle,
    #homeView footer{text-shadow:0 1px 6px rgba(0,0,0,.65)}

    /* menu hexagon langsung terbuka saat kartu mekar */
    #homeView.open .home-hub-item{
      transform:translate(var(--tx), var(--ty)) scale(1);
      opacity:1;
      pointer-events:auto;
      transition-delay:calc(.4s + var(--delay, 0s));
    }
    #homeView.open .home-hub::before{animation:none; opacity:0}

    /* ===== SLIDESHOW LATAR (foto JPEG, ganti tiap 5 detik) =====
       Dua lapis saling bertukar: crossfade + blur-ke-tajam + zoom pelan (Ken Burns).
       Berada di bawah lapis ::before (cahaya & grid) dan ::after (gedung). */
    #bgSlides{
      position:fixed;
      inset:0;
      z-index:-2;
      overflow:hidden;
      pointer-events:none;
      display:none;
      background:#061631;
    }
    body.home-mode #bgSlides{display:block}
    .bg-slide{
      position:absolute;
      inset:-4%;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      transform:scale(1.02);
      transition:opacity 2.4s ease-in-out;
      will-change:opacity, transform;
    }
    .bg-slide.active{
      opacity:1;
      animation:bgZoom 10s linear forwards;
    }
    .bg-slide.alt.active{animation-name:bgZoomAlt}
    @keyframes bgZoom{
      from{transform:scale(1.02) translate3d(0,0,0)}
      to  {transform:scale(1.08) translate3d(-1%,-.6%,0)}
    }
    @keyframes bgZoomAlt{
      from{transform:scale(1.08) translate3d(1%,.6%,0)}
      to  {transform:scale(1.02) translate3d(0,0,0)}
    }
    @media (prefers-reduced-motion:reduce){
      .bg-slide.active{animation:none; transform:scale(1.02)}
    }

    /* ===== Logo tunggal (lingkaran, halaman detail) ===== */
    .logo-wrap{
      width:96px;
      height:96px;
      margin:-24px auto 10px;
      border-radius:50%;
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 8px 18px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.12);
      flex-shrink:0;
    }

    /* ===== Logo Home: pil memanjang ===== */
    .logo-wrap.pill{
      width:min(320px, 82%);
      height:auto;
      aspect-ratio:2.93 / 1;
      margin:0 auto 12px;
      border-radius:999px;
      background:var(--cream);
      padding:8px 14px;
    }
    .logo-wrap.pill .logo{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .logo{
      width:82%;
      height:82%;
      object-fit:contain;
      display:block;
    }

    h1{
      color:#ffd873;
      font-size:21px;
      margin:8px 0 6px;
    }

    .subtitle{
      color:#eaf1ff;
      font-size:13.5px;
      line-height:1.55;
      margin:0 0 22px;
      opacity:.94;
    }

    footer{
      margin-top:18px;
      color:rgba(255,255,255,.62);
      font-size:11.5px;
    }

    /* ===== Tombol kembali (halaman detail) ===== */
    .back-btn{
      position:absolute;
      top:16px;
      left:16px;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      width:36px;
      height:36px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.35);
      color:#eaf1ff;
      font-size:16px;
      border-radius:50%;
      cursor:pointer;
      transition:background .18s ease, transform .18s ease;
    }
    .back-btn:hover{background:rgba(255,255,255,.22); transform:translateX(-2px)}

    /* ===== HONEYCOMB GRID (halaman detail) ===== */
    .hex-grid{
      position:relative;
      margin:6px auto 10px;
    }

    .hex-item{
      appearance:none;
      background:none;
      border:none;
      padding:9% 15%;
      box-sizing:border-box;
      position:absolute;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:inherit;
      font:inherit;
      text-decoration:none;
      cursor:pointer;
      z-index:1;
      transition:transform .2s cubic-bezier(.165,.84,.44,1), z-index 0s;
    }
    .hex-item:focus-visible{
      outline:2px solid var(--gold);
      outline-offset:3px;
    }
    .hex-item:hover{
      transform:scale(1.08);
      z-index:2;
    }

    .hex-shape{
      position:absolute;
      inset:0;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(0,0,0,.35);
      transition:box-shadow .2s ease, background .2s ease;
    }
    .hex-item:hover .hex-shape{
      box-shadow:0 14px 28px rgba(0,0,0,.5);
    }

    .hex-img{
      position:relative;
      z-index:1;
      width:120%;
      max-height:120%;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
    }

    .hex-icon{
      position:relative;
      z-index:1;
      font-size:22px;
      line-height:1;
      flex:0 0 auto;
    }
    .hex-icon-img{
      position:relative;
      z-index:1;
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
    }
    .hex-label{
      position:relative;
      z-index:1;
      margin-top:0;
      font-size:10.5px;
      font-weight:700;
      color:var(--blue);
      line-height:1.15;
      text-align:center;
      padding:0 4px;
      transition:color .2s ease;
      flex:0 0 auto;
    }
    .hex-item:hover .hex-label{
      color:var(--gold);
    }

    /* ===== Hub animatif Home =====
       Susunan 3 panel (jarak 120°): SIMBG kiri-atas, PPBL kanan-atas,
       DLL bawah. Pusat hub ditaruh di --hub-cy supaya panel bawah muat.
       Elemen .home-hub kini TIDAK TAMPIL (yang tampil adalah orb tetap
       di tengah layar); ia hanya jadi titik acuan posisi hexagon. */
    .home-hub-wrap{
      --hub-cy:114px;
      position:relative;
      width:100%;
      max-width:300px;
      height:290px;
      margin:4px auto 4px;
    }
    .home-hub{
      position:absolute;
      top:var(--hub-cy); left:50%;
      width:112px; height:112px;
      margin:-56px 0 0 -56px;
      visibility:hidden;
      pointer-events:none;
      border-radius:50%;
      z-index:5;
    }
    .home-hub-item{
      appearance:none;
      background:none;
      border:none;
      padding:0;
      position:absolute;
      top:var(--hub-cy); left:50%;
      width:96px; height:110px;
      margin:-55px 0 0 -48px;
      z-index:3;
      cursor:pointer;
      transform:translate(0,0) scale(.2);
      opacity:0;
      pointer-events:none;
      transition:transform .5s cubic-bezier(.22,1,.36,1), opacity .3s ease;
    }
    .home-hub-wrap:hover .home-hub-item,
    .home-hub-wrap.pinned .home-hub-item{
      transform:translate(var(--tx), var(--ty)) scale(1);
      opacity:1;
      pointer-events:auto;
      transition-delay:var(--delay, 0s);
    }
    @keyframes hubPulse{
      0%{transform:scale(1); opacity:.55}
      75%{transform:scale(1.4); opacity:0}
      100%{opacity:0}
    }
    .home-hub-shape{
      position:relative;
      width:100%; height:100%;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background:linear-gradient(160deg,#0c3a6e,var(--gold) 55%,#0e5aa8);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:6px; padding:10px;
      box-shadow:0 10px 22px rgba(0,0,0,.4);
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background .25s ease;
    }
    .home-hub-item:hover .home-hub-shape,
    .home-hub-item:focus-visible .home-hub-shape{
      transform:scale(1.1);
      background:linear-gradient(160deg,#0e5aa8,var(--gold) 140%);
      box-shadow:0 14px 28px rgba(0,0,0,.5);
    }
    .home-hub-item-img{
      width:60%; max-height:44%;
      object-fit:contain;
    }
    .home-hub-item-label{
      font-size:10.5px;
      font-weight:700;
      color:#eaf1ff;
      text-align:center;
      line-height:1.2;
      padding:0 2px;
      transition:color .2s ease;
    }
    .home-hub-item:hover .home-hub-item-label{
      color:#08182e;
    }
    @media (max-width:600px){
      .home-hub-wrap{--hub-cy:108px; height:275px}
      .home-hub-item{width:86px;height:98px;margin:-49px 0 0 -43px}
    }

    .music-btn{
      position:fixed;
      top:16px;
      right:16px;
      width:46px;
      height:46px;
      border-radius:50%;
      background:rgba(246,243,234,.96);
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:999;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
    }

    .music-btn:hover{transform:scale(1.05)}
    .music-btn svg{width:20px;height:20px;fill:#0a1628}
    .music-btn.playing{animation:pulse 1.5s infinite ease-in-out}

    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,.45)}
      50%{box-shadow:0 0 0 8px rgba(240,180,41,0)}
    }

    /* ===== Badge penghitung pengunjung (Supabase) ===== */
    .visitor-counter{
      position:fixed;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:7px;
      background:rgba(246,243,234,.96);
      color:var(--text);
      font-weight:700;
      font-size:12.5px;
      padding:9px 15px 9px 12px;
      border-radius:999px;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
      z-index:999;
      border-left:3px solid var(--gold);
      white-space:nowrap;
      cursor:pointer;
      border-top:none;border-right:none;border-bottom:none;
      user-select:none;
    }
    .visitor-counter:hover{background:#fff}
    .visitor-counter .v-icon{font-size:14px;flex:0 0 auto}
    .visitor-counter .v-label{opacity:.7;font-weight:600}
    .visitor-counter .v-count{color:var(--blue);font-weight:800}
    .visitor-counter .v-caret{opacity:.55;font-size:10px;margin-left:1px;transition:transform .2s ease}
    .visitor-counter.open .v-caret{transform:rotate(180deg)}

    .visitor-panel{
      position:fixed;
      top:66px;
      left:16px;
      width:236px;
      max-height:0;
      opacity:0;
      overflow:hidden;
      background:rgba(246,243,234,.98);
      color:var(--text);
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.32);
      z-index:998;
      transition:max-height .25s ease, opacity .2s ease, padding .25s ease;
      padding:0 14px;
    }
    .visitor-panel.open{
      max-height:400px;
      opacity:1;
      padding:12px 14px 14px;
    }
    .visitor-panel-head{
      font-size:12.5px;
      font-weight:800;
      color:var(--blue);
      margin-bottom:8px;
      padding-bottom:6px;
      border-bottom:1px solid rgba(11,75,145,.18);
    }
    .visitor-panel-total{font-size:12px;margin-bottom:8px;opacity:.85}
    .visitor-panel-total b{color:var(--blue)}

    .visitor-tabs{
      display:flex;
      gap:6px;
      margin-bottom:8px;
    }
    .v-tab{
      flex:1;
      font-size:11px;
      font-weight:700;
      padding:6px 0;
      border-radius:8px;
      border:1px solid rgba(11,75,145,.28);
      background:transparent;
      color:var(--blue);
      cursor:pointer;
      transition:background .15s ease, color .15s ease;
    }
    .v-tab.active{
      background:var(--blue);
      color:#fff;
      border-color:var(--blue);
    }

    .visitor-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
    .visitor-table th{
      text-align:left;
      font-size:10.5px;
      text-transform:uppercase;
      letter-spacing:.4px;
      opacity:.6;
      padding:3px 0;
    }
    .visitor-table td{padding:4px 0;border-top:1px dashed rgba(16,33,59,.12)}
    .visitor-table td:last-child{text-align:right;font-weight:700;color:var(--blue)}

    @media (max-width:600px){
      body{
        padding:0 10px 28px;
        background-attachment:scroll;
      }

      .hero{
        height:240px;
        border-radius:0 0 22px 22px;
      }
      .hero-wrap{height:240px}

      .card{
        padding:22px 15px 16px;
        border-radius:20px;
      }
      .view-wrap{margin:-26px auto 0}
      body:not(.home-mode) .view-wrap{margin:14px auto 0}
      body:not(.home-mode) .hero-wrap{margin:14px auto 0}

      .logo-wrap{
        width:84px;
        height:84px;
        margin:-20px auto 8px;
      }
      .logo-wrap.pill{
        margin:0 auto 10px;
      }
      #homeView{
        padding-top:22px;
      }

      h1{font-size:19px}
      .subtitle{font-size:13px}
      .music-btn{top:12px;right:12px}
      .visitor-counter{top:12px;left:12px;font-size:11.5px;padding:7px 12px 7px 10px}
      .visitor-panel{top:58px;left:12px;width:min(236px,calc(100vw - 24px))}

      .hex-icon{font-size:20px}
      .hex-label{font-size:9.5px}
    }
  </style>
</head>

<body class="home-mode">
<amp-auto-ads type="adsense"
        data-ad-client="ca-pub-2710424249080203">
</amp-auto-ads>

  <!-- Slideshow latar halaman Home (foto JPEG) -->
  <div id="bgSlides" aria-hidden="true">
    <div class="bg-slide" id="bgSlideA"></div>
    <div class="bg-slide alt" id="bgSlideB"></div>
  </div>

  <div class="hero-wrap">
    <div class="hero" id="hero" aria-label="Kolase dokumentasi kegiatan"></div>
  </div>

  <!-- Musik: src diganti otomatis sesuai halaman aktif -->
  <audio id="bgMusic" loop preload="none"></audio>

  <button class="music-btn" id="musicBtn"
          title="Putar musik" aria-label="Putar atau jeda musik">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none">

  // ================== HONEYCOMB (halaman detail) ==================
  function chunkIntoRows(items, perRow){
    const rows = [];
    for (let i = 0; i < items.length; i += perRow){
      rows.push(items.slice(i, i + perRow));
    }
    return rows;
  }

  function computeHexWidth(containerEl, perRow){
    const available = containerEl.clientWidth || 300;
    const w = available / (perRow + 0.5);
    return Math.max(58, Math.min(112, Math.floor(w)));
  }

  function layoutHoneycomb(containerEl, items, itemHtmlFn, perRow){
    const hexW = computeHexWidth(containerEl, perRow);
    const hexH = hexW / (Math.sqrt(3) / 2);
    const colStep = hexW;
    const rowStep = hexH * 0.75;
    const offsetX = hexW / 2;

    const rows = chunkIntoRows(items, perRow);
    const hasOffsetRow = rows.length > 1;

    let totalWidth = 0;
    rows.forEach((row, r) => {
      const rowOffset = (hasOffsetRow && r % 2 === 1) ? offsetX : 0;
      const rowWidth = row.length * colStep + rowOffset;
      if (rowWidth > totalWidth) totalWidth = rowWidth;
    });
    const totalHeight = (rows.length - 1) * rowStep + hexH;

    containerEl.style.width = totalWidth + "px";
    containerEl.style.height = totalHeight + "px";

    containerEl.innerHTML = rows.map((row, r) => row.map((item, c) => {
      const x = c * colStep + (hasOffsetRow && r % 2 === 1 ? offsetX : 0);
      const y = r * rowStep;
      return itemHtmlFn(item, x, y, hexW, hexH);
    }).join("")).join("");
  }

  // ---- Hub animatif Home ----
  // Susunan 3 layanan, jarak 120° antar panel (sumbu Y layar mengarah ke bawah):

  const ANGLE_BY_ID = { simbg: 210, ppbl: 330, dll: 90 };

  function buildHexGrid(){
    const HUB_ICON = "assets/icon-menu.png";
    const n = segments.length;
    const radius = 118;
    const startAngle = (n === 2) ? 180 : -90; // cadangan kalau ada layanan baru

    const items = segments.map((seg, i) => {
      const angleDeg = (ANGLE_BY_ID[seg.id] !== undefined)
        ? ANGLE_BY_ID[seg.id]
        : startAngle + (360 / n) * i;
      const rad = angleDeg * Math.PI / 180;
      const tx = Math.round(Math.cos(rad) * radius);
      const ty = Math.round(Math.sin(rad) * radius);
      return `
        <button class="home-hub-item" type="button" data-id="${seg.id}"
                aria-label="Buka ${seg.hexLabel}"
                style="--tx:${tx}px; --ty:${ty}px; --delay:${(i * 0.07).toFixed(2)}s">
          <span class="home-hub-shape">
            <img class="home-hub-item-img" src="${seg.logo}" alt="Logo ${seg.hexLabel}">
            <span class="home-hub-item-label">${seg.hexLabel}</span>
          </span>
        </button>
      `;
    }).join("");

    // .home-hub disembunyikan (CSS); hanya jadi titik acuan posisi hexagon.
    // Yang tampil di tengah layar adalah orb tetap (#homeOrb).
    hexGrid.innerHTML = `
      <div class="home-hub" id="homeHub" aria-hidden="true">
        <img src="${HUB_ICON}" alt="">
      </div>
      ${items}
    `;

    hexGrid.querySelectorAll(".home-hub-item").forEach(btn => {

  // ================== HOME: muat 1 layar, TANPA SCROLL ==================
  // Kartu digeser supaya titik tengah hub tepat berada di tengah layar,
  // sama persis dengan posisi orb. Kartu juga mekar dari titik itu.
  function fitHomeToViewport(){
    const wrap = document.querySelector(".view-wrap");
    wrap.style.transform = "none";
    if (!document.body.classList.contains("home-mode")) return;

    const hub = document.getElementById("homeHub");
    if (!hub) return;

    // posisi pusat hub di dalam kartu (offset tidak terpengaruh transform)
    const hubY = hexGrid.offsetTop + hub.offsetTop + hub.offsetHeight / 2;
    homeView.style.transformOrigin = `50% ${hubY}px`;

    const pad = 20;
    const availW = window.innerWidth - pad * 2;
    const availH = window.innerHeight - pad * 2;
    const w = wrap.offsetWidth;
    const h = wrap.offsetHeight;

    const scale = Math.min(
      1,
      availW / w,
      availH / (2 * Math.max(hubY, h - hubY))
    );

    // geser supaya pusat hub = pusat layar (sama dengan orb)
    const dy = hubY - h / 2;
    const ty = -scale * dy;

    if (scale < 0.999 || Math.abs(ty) > 0.5){
      wrap.style.transformOrigin = "center center";
      wrap.style.transform = `translateY(${ty}px) scale(${scale})`;
    }
  }

  // ================== PENGHITUNG PENGUNJUNG — HARIAN & BULANAN (Supabase) ==================
  // SQL setup (jalankan sekali di Supabase -> SQL Editor):
  /*
    create table if not exists visit_total (
      id int primary key default 1,
      count bigint not null default 0
    );
    insert into visit_total (id, count) values (1, 0)
      on conflict (id) do nothing;

      day date primary key,

    );

    create table if not exists visit_monthly (
      month date primary key,
      count bigint not null default 0
    );

    create or replace function record_visit()
    returns void
    language plpgsql
    security definer
    as $$
    begin
      update visit_total set count = count + 1 where id = 1;

      insert into visit_daily (day, count) values (current_date, 1)
        on conflict (day) do update set count = visit_daily.count + 1;

      insert into visit_monthly (month, count)
        values (date_trunc('month', current_date)::date, 1)
        on conflict (month) do update set count = visit_monthly.count + 1;
    end;
    $$;

    alter table visit_total enable row level security;
    alter table visit_daily enable row level security;
    alter table visit_monthly enable row level security;

    drop policy if exists "publik boleh baca total" on visit_total;
    create policy "publik boleh baca total" on visit_total for select using (true);

    drop policy if exists "publik boleh baca harian" on visit_daily;
    create policy "publik boleh baca harian" on visit_daily for select using (true);

    drop policy if exists "publik boleh baca bulanan" on visit_monthly;
    create policy "publik boleh baca bulanan" on visit_monthly for select using (true);
  */
  const SUPABASE_URL = "https://kvcnbyasnvpmnrbvkjjg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_J9EFLRjCWE9gaLgsQLKeLQ_x-Wwu3wF";

  const HARI_DITAMPILKAN = 7;
  const BULAN_DITAMPILKAN = 6;

  function formatTanggalID(isoDate){
    const [y, m, d] = isoDate.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }

  function formatBulanID(isoMonth){
    const [y, m] = isoMonth.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  }

  (function initVisitorBadge(){
    const countEl = document.getElementById("visitorCount");
    const totalDetailEl = document.getElementById("visitorTotalDetail");
    const tableBody = document.getElementById("visitorTableBody");
    const colHead = document.getElementById("visitorColHead");
    const counterBtn = document.getElementById("visitorCounter");
    const panel = document.getElementById("visitorPanel");
    const tabDaily = document.getElementById("tabDaily");
    const tabMonthly = document.getElementById("tabMonthly");

    counterBtn.addEventListener("click", () => {
      counterBtn.classList.toggle("open");
      panel.classList.toggle("open");
    });

    let activeTab = "daily";
    let dailyRows = [];
    let monthlyRows = [];
    const todayKey = new Date().toLocaleDateString("sv-SE");

    function renderTable(){
      if (activeTab === "daily"){
        colHead.textContent = "Tanggal";
        tableBody.innerHTML = dailyRows.length
          ? dailyRows.map(row => `
              <tr>
                <td>${formatTanggalID(row.day)}${row.day === todayKey ? " (hari ini)" : ""}</td>
                <td>${Number(row.count).toLocaleString("id-ID")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="2">Belum ada data</td></tr>';
      } else {
        colHead.textContent = "Bulan";
        tableBody.innerHTML = monthlyRows.length
          ? monthlyRows.map(row => `
              <tr>
                <td>${formatBulanID(row.month)}</td>
                <td>${Number(row.count).toLocaleString("id-ID")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="2">Belum ada data</td></tr>';
      }
    }

    function setActiveTab(tab){
      activeTab = tab;
      tabDaily.classList.toggle("active", tab === "daily");
      tabMonthly.classList.toggle("active", tab === "monthly");
      renderTable();
    }

    tabDaily.addEventListener("click", () => setActiveTab("daily"));
    tabMonthly.addEventListener("click", () => setActiveTab("monthly"));

    const isConfigured = !SUPABASE_URL.startsWith("GANTI_") && !SUPABASE_ANON_KEY.startsWith("GANTI_");
    if (!isConfigured){
      countEl.textContent = "-";
      if (totalDetailEl) totalDetailEl.textContent = "-";
      tableBody.innerHTML = '<tr><td colspan="2">SUPABASE_URL / KEY belum diisi</td></tr>';
      console.error("Isi dulu SUPABASE_URL dan SUPABASE_ANON_KEY di kode sebelum badge pengunjung bisa jalan.");
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchTotal(){
      const { data, error } = await sb.from("visit_total").select("count").eq("id", 1).single();
      if (error) console.error("Supabase (visit_total):", error.message);
      const total = (!error && data) ? data.count : "-";
      countEl.textContent = (typeof total === "number") ? total.toLocaleString("id-ID") : total;
      if (totalDetailEl) totalDetailEl.textContent = countEl.textContent;
    }

    async function fetchDailyRecap(){
      const { data, error } = await sb
        .from("visit_daily")
        .select("day, count")
        .order("day", { ascending: false })
        .limit(HARI_DITAMPILKAN);

      if (error) console.error("Supabase (visit_daily):", error.message);
      dailyRows = (!error && data) ? data : [];
      renderTable();
    }

    async function fetchMonthlyRecap(){
      const { data, error } = await sb
        .from("visit_monthly")
        .select("month, count")
        .order("month", { ascending: false })
        .limit(BULAN_DITAMPILKAN);

      if (error) console.error("Supabase (visit_monthly):", error.message, "— pastikan sudah menjalankan SQL setup tabel visit_monthly.");
      monthlyRows = (!error && data) ? data : [];
      renderTable();
    }

    async function recordAndLoad(){
      const { error } = await sb.rpc("record_visit");
      if (error) console.error("Supabase (record_visit):", error.message, "— pastikan sudah menjalankan SQL setup di SQL Editor.");
      await fetchTotal();
      await fetchDailyRecap();
      await fetchMonthlyRecap();
    }

    recordAndLoad();
  })();
</script>

    const INTERVAL   = 5000;   // jeda tiap foto (ms): 5000 = 5 detik

    // CADANGAN: dipakai kalau daftar otomatis dari GitHub gagal dimuat.
    // Isi dengan nama file JPEG di folder assets/background, mis. ["bg1.jpg","bg2.jpg"]
    const FALLBACK_FILES = [];

    const layers = [document.getElementById("bgSlideA"), document.getElementById("bgSlideB")];
    if (!layers[0] || !layers[1]) return;

    let urls = [];
    let index = -1;
    let front = 0;
    let timer = null;

    async function loadFileList(){
      try {
        const cached = sessionStorage.getItem("bgFiles");
        if (cached) return JSON.parse(cached);
      } catch(e){}
      try {
        const res = await fetch(GITHUB_API, { headers: { "Accept": "application/vnd.github+json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const files = data
          .filter(f => f.type === "file" && /\.jpe?g$/i.test(f.name))
          .map(f => f.name)
          .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        try { sessionStorage.setItem("bgFiles", JSON.stringify(files)); } catch(e){}
        return files;
      } catch(err){
        console.warn("Slideshow: gagal membaca daftar dari GitHub, memakai FALLBACK_FILES.", err);
        return FALLBACK_FILES;
      }
    }

    function preload(url){
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => resolve(false);
        img.src = url;
      });
    }

    async function showNext(){
      if (!urls.length) return;
      // cari foto berikutnya yang berhasil dimuat (lewati yang rusak)
      for (let tries = 0; tries < urls.length; tries++){
        index = (index + 1) % urls.length;
        const url = urls[index];
        if (await preload(url)){
          const next = 1 - front;
          layers[next].style.backgroundImage = `url("${url}")`;
          layers[next].classList.remove("active");
          void layers[next].offsetWidth;            // restart animasi zoom
          layers[next].classList.add("active");
          layers[front].classList.remove("active");
          front = next;
          return;
        }
      }
    }

    function schedule(){
      stop();
      timer = setTimeout(async () => {
        await showNext();      // foto berikutnya dimuat penuh dulu, baru tampil
        schedule();            // lalu tunggu 5 detik lagi
      }, INTERVAL);
    }
    function start(){ schedule(); }
    function stop(){
      if (timer){ clearTimeout(timer); timer = null; }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stop(); else if (urls.length > 1) start();
    });

    (async function(){
      const files = await loadFileList();
      urls = files.map(name => BG_BASE + encodeURIComponent(name));
      if (!urls.length){
        console.warn("Slideshow: tidak ada file JPEG. Isi FALLBACK_FILES atau cek folder assets/background.");
        return;
      }
      await showNext();                 // foto pertama langsung tampil
      if (urls.length > 1) start();
    })();
  })();
</script>
</body>
