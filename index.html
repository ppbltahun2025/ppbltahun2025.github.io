<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b3a">
  <meta name="description" content="Daftar link serbaguna SIMBG Gresik.">
  <title>SIMBG Gresik — Daftar Link</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2710424249080203"
     crossorigin="anonymous"></script>
  <!-- Favicon (logo tab browser) -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">

  <style>
    :root{
      --navy:#071b3a;
      --blue:#0b4b91;
      --gold:#f0b429;
      --cream:#f6f3ea;
      --text:#10213b;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:"Segoe UI",Arial,sans-serif;
      color:#fff;
      background:
        linear-gradient(180deg,rgba(4,15,32,.42),rgba(4,15,32,.92)),
        var(--hero-bg-url, url("assets/image.png")) center center/cover fixed no-repeat;
      padding:0 16px 38px;
      transition:background-image .5s ease;
      overflow-x:hidden;
    }

    /* ===== HERO / kolase foto, berganti sesuai halaman aktif ===== */
    .hero-wrap{
      position:relative;
      width:min(1100px,100%);
      height:clamp(230px,42vw,540px);
      margin:0 auto;
    }

    .hero{
      position:absolute;
      inset:0;
      border-radius:0 0 28px 28px;
      overflow:hidden;
      box-shadow:0 16px 45px rgba(0,0,0,.30);
      background:
        linear-gradient(180deg,rgba(7,27,58,.05),rgba(7,27,58,.35)),
        url("assets/image.png") center center/cover no-repeat;
      opacity:1;
      transition:opacity .55s ease, background-image .1s linear;
    }

    /* ===== Wrapper kartu (Home & Detail) ===== */
    .view-wrap{
      width:100%;
      max-width:480px;
      margin:-36px auto 0;
      position:relative;
      z-index:2;
    }

    .card{
      text-align:center;
      padding:28px 20px 20px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:24px;
      background:rgba(7,27,58,.88);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 45px rgba(0,0,0,.35);
      overflow:visible;
      animation:fadeIn .35s ease;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(6px)}
      to{opacity:1; transform:translateY(0)}
    }

    /* ===== Logo tunggal (halaman detail) ===== */
    .logo-wrap{
      width:96px;
      height:96px;
      margin:-24px auto 10px;
      border-radius:50%;
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 8px 18px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.12);
      flex-shrink:0;
    }

    .logo{
      width:82%;
      height:82%;
      object-fit:contain;
      display:block;
    }

    h1{
      color:#ffd873;
      font-size:21px;
      margin:8px 0 6px;
    }

    .subtitle{
      color:#eaf1ff;
      font-size:13.5px;
      line-height:1.55;
      margin:0 0 22px;
      opacity:.94;
    }

    .link-btn{
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      background:var(--cream);
      color:var(--text);
      font-weight:650;
      font-size:14.5px;
      text-decoration:none;
      padding:14px 16px;
      margin-bottom:12px;
      border-left:4px solid var(--gold);
      border-radius:12px;
      box-shadow:0 5px 15px rgba(0,0,0,.12);
      transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
    }

    .link-btn:hover{
      background:#fff;
      transform:translateY(-2px);
      box-shadow:0 9px 20px rgba(0,0,0,.18);
    }

    .link-btn .icon{
      font-size:18px;
      flex:0 0 auto;
    }

    footer{
      margin-top:18px;
      color:rgba(255,255,255,.62);
      font-size:11.5px;
    }

    /* ===== Tombol kembali (halaman detail) ===== */
    .back-btn{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:transparent;
      border:1px solid rgba(255,255,255,.35);
      color:#eaf1ff;
      font-size:12.5px;
      font-weight:600;
      padding:7px 14px;
      border-radius:999px;
      cursor:pointer;
      margin:0 0 16px;
      transition:background .18s ease, transform .18s ease;
    }
    .back-btn:hover{background:rgba(255,255,255,.14); transform:translateX(-2px)}

    /* ===== Grid pilihan hexagon (halaman home) ===== */
    .hex-grid{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:26px 20px;
      margin:6px 0 6px;
      padding:0 4px;
    }

    .hex-item{
      appearance:none;
      background:none;
      border:none;
      padding:6px;
      width:128px;
      display:flex;
      flex-direction:column;
      align-items:center;
      color:inherit;
      font:inherit;
      cursor:pointer;
      border-radius:18px;
    }
    .hex-item:focus-visible{
      outline:2px solid var(--gold);
      outline-offset:3px;
    }

    .hex-shape{
      width:110px;
      height:126px;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 24px rgba(0,0,0,.35);
      transition:transform .2s ease, box-shadow .2s ease;
    }
    .hex-item:hover .hex-shape{
      transform:translateY(-4px) scale(1.05);
      box-shadow:0 14px 30px rgba(0,0,0,.45);
    }

    .hex-shape img{
      width:64%;
      height:64%;
      object-fit:contain;
      display:block;
    }

    .hex-label{
      margin-top:10px;
      font-size:13px;
      font-weight:700;
      color:#ffd873;
      line-height:1.3;
    }

    .music-btn{
      position:fixed;
      top:16px;
      right:16px;
      width:46px;
      height:46px;
      border-radius:50%;
      background:rgba(246,243,234,.96);
      border:none;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:999;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
    }

    .music-btn:hover{transform:scale(1.05)}
    .music-btn svg{width:20px;height:20px;fill:#0a1628}
    .music-btn.playing{animation:pulse 1.5s infinite ease-in-out}

    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,.45)}
      50%{box-shadow:0 0 0 8px rgba(240,180,41,0)}
    }

    /* ===== Badge penghitung pengunjung (tersimpan permanen di Supabase) ===== */
    .visitor-counter{
      position:fixed;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:7px;
      background:rgba(246,243,234,.96);
      color:var(--text);
      font-weight:700;
      font-size:12.5px;
      padding:9px 15px 9px 12px;
      border-radius:999px;
      box-shadow:0 2px 10px rgba(0,0,0,.28);
      z-index:999;
      border-left:3px solid var(--gold);
      white-space:nowrap;
      cursor:pointer;
      border-top:none;border-right:none;border-bottom:none;
      user-select:none;
    }
    .visitor-counter:hover{background:#fff}
    .visitor-counter .v-icon{font-size:14px;flex:0 0 auto}
    .visitor-counter .v-label{opacity:.7;font-weight:600}
    .visitor-counter .v-count{color:var(--blue);font-weight:800}
    .visitor-counter .v-caret{opacity:.55;font-size:10px;margin-left:1px;transition:transform .2s ease}
    .visitor-counter.open .v-caret{transform:rotate(180deg)}

    /* ===== Panel rincian pengunjung per hari ===== */
    .visitor-panel{
      position:fixed;
      top:66px;
      left:16px;
      width:236px;
      max-height:0;
      opacity:0;
      overflow:hidden;
      background:rgba(246,243,234,.98);
      color:var(--text);
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.32);
      z-index:998;
      transition:max-height .25s ease, opacity .2s ease, padding .25s ease;
      padding:0 14px;
    }
    .visitor-panel.open{
      max-height:340px;
      opacity:1;
      padding:12px 14px 14px;
    }
    .visitor-panel-head{
      font-size:12.5px;
      font-weight:800;
      color:var(--blue);
      margin-bottom:8px;
      padding-bottom:6px;
      border-bottom:1px solid rgba(11,75,145,.18);
    }
    .visitor-panel-total{font-size:12px;margin-bottom:8px;opacity:.85}
    .visitor-panel-total b{color:var(--blue)}
    .visitor-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
    .visitor-table th{
      text-align:left;
      font-size:10.5px;
      text-transform:uppercase;
      letter-spacing:.4px;
      opacity:.6;
      padding:3px 0;
    }
    .visitor-table td{padding:4px 0;border-top:1px dashed rgba(16,33,59,.12)}
    .visitor-table td:last-child{text-align:right;font-weight:700;color:var(--blue)}

    @media (max-width:600px){
      body{
        padding:0 10px 28px;
        background-attachment:scroll;
      }

      .hero{
        height:240px;
        border-radius:0 0 22px 22px;
      }
      .hero-wrap{height:240px}

      .card{
        padding:22px 15px 16px;
        border-radius:20px;
      }
      .view-wrap{margin:-26px auto 0}

      .logo-wrap{
        width:84px;
        height:84px;
        margin:-20px auto 8px;
      }

      h1{font-size:19px}
      .subtitle{font-size:13px}
      .music-btn{top:12px;right:12px}
      .visitor-counter{top:12px;left:12px;font-size:11.5px;padding:7px 12px 7px 10px}
      .visitor-panel{top:58px;left:12px;width:min(236px,calc(100vw - 24px))}

      .hex-grid{gap:20px 14px}
      .hex-item{width:104px}
      .hex-shape{width:92px;height:106px}
    }
  </style>
</head>

<body>

  <div class="hero-wrap">
    <div class="hero" id="hero" aria-label="Kolase dokumentasi kegiatan"></div>
  </div>

  <!-- Musik: id="bgMusic" src akan diganti otomatis sesuai halaman aktif -->
  <audio id="bgMusic" loop preload="none"></audio>

  <button class="music-btn" id="musicBtn"
          title="Putar musik" aria-label="Putar atau jeda musik">
    <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="iconPause" viewBox="0 0 24 24" style="display:none">
      <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
    </svg>
  </button>

  <!-- Badge total pengunjung: nilainya tersimpan permanen di Supabase (server),
       sama untuk semua orang, dan klik badge ini untuk buka rinciannya -->
  <div class="visitor-counter" id="visitorCounter" title="Klik untuk lihat rincian">
    <span class="v-icon">👁️</span>
    <span class="v-label">Pengunjung:</span>
    <span class="v-count" id="visitorCount">…</span>
    <span class="v-caret">▾</span>
  </div>

  <div class="visitor-panel" id="visitorPanel">
    <div class="visitor-panel-head">Statistik Pengunjung</div>
    <div class="visitor-panel-total">Total sepanjang waktu: <b id="visitorTotalDetail">…</b></div>
    <table class="visitor-table">
      <thead><tr><th>Tanggal</th><th>Pengunjung</th></tr></thead>
      <tbody id="visitorTableBody">
        <tr><td colspan="2">Memuat…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="view-wrap">

    <!-- ===== HALAMAN HOME: pilih layanan lewat hexagon ===== -->
    <main class="card" id="homeView">
      <h1>Daftar Link Serbaguna</h1>
      <p class="subtitle">Pilih layanan di bawah ini untuk membuka daftar linknya</p>

      <div class="hex-grid" id="hexGrid"></div>

      <footer>© 2026 Pemerintah Kabupaten Gresik</footer>
    </main>

    <!-- ===== HALAMAN DETAIL: diisi otomatis oleh JS sesuai hexagon yang diklik ===== -->
    <main class="card" id="detailView" style="display:none">
      <button class="back-btn" id="backBtn">&#8592; Kembali</button>

      <div class="logo-wrap">
        <img class="logo" id="detailLogo" src="" alt="">
      </div>

      <h1 id="detailTitle"></h1>
      <p class="subtitle" id="detailSubtitle"></p>

      <div id="detailLinks"></div>

      <footer id="detailFooter"></footer>
    </main>

  </div>

 <!-- Supabase JS client: catat & tarik data pengunjung dari database Supabase-mu
      sendiri — angka mentah, tanpa logika "unique visitor/session" seperti
      analytics tool, jadi total selalu = jumlah semua angka harian. -->
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

 <script>

  // ================== DATA LAYANAN ==================
  // Tambah layanan baru cukup tambah 1 objek di array ini —
  // hexagon di halaman Home & halaman detailnya otomatis ikut terbentuk.
  const segments = [
    {
      id: "simbg",
      hexLabel: "SIMBG Gresik",
      logo: "assets/logo.png",
      hero: "assets/image.png",
      audio: "assets/lagu.mp3",
      title: "Daftar Link Serbaguna SIMBG",
      subtitle: "Tetap semangat melayani dan memastikan keandalan bangunan di Gresik",
      footer: "© 2026 SIMBG Gresik",
      links: [
        { icon: "📱", label: "SUPERMASTER SIMBG", href: "https://script.google.com/macros/s/AKfycbyU-7kXWwQVl2NWhL2iWqjoW3dNyBXgoXserxakK3GpA8lJn9s5sEIuaC3P5FyQouE0/exec" },
        { icon: "✉️", label: "Master SIMBG 2026", href: "https://docs.google.com/spreadsheets/d/1DXYwiOmHVvjwkL_QQPEyZhEHXwkhtc98jMJ6fPW89l0" },
        { icon: "🔗", label: "Drive SIMBG 2026", href: "https://drive.google.com/drive/folders/17WOt-qZilYArpQeI-JsOscskflPXW_kK" },
        { icon: "✉️", label: "Master Agenda SIMBG 2026", href: "https://docs.google.com/spreadsheets/d/1m7r3SLQZbnjBEhdrR9BRTtzNx0RzENA37smcVQrkbrk" },
        { icon: "🔥", label: "Rekap Bola Genih", href: "https://docs.google.com/spreadsheets/d/1f0xtcx1sN5F5uZ4bWmvzUNB96B9p_tCZ4HNBkPf3H8Q/" }
      ]
    },
    {
      id: "ppbl",
      hexLabel: "Penataan Bangunan Gedung",
      logo: "assets/logo2.png",
      hero: "assets/image2.png",
      audio: "assets/lagu2.mp3",
      title: "Daftar Link Penataan Bangunan Gedung",
      subtitle: "Mendukung tata kelola dan penataan bangunan gedung yang tertib dan berkelanjutan",
      footer: "© 2026 Penataan Bangunan Gedung",
      links: [
        { icon: "🗂️", label: "DRIVE PPBL", href: "https://drive.google.com/drive/folders/1oO_Zc5SuTDP43Uk8CYOWvK2w3W-KI_5q" },
        { icon: "📋", label: "CHECKLIST PROYEK 2026", href: "https://docs.google.com/spreadsheets/d/1TY-Lo9vXqowYkz5ok3A3GEdq3-M7OcLn2busfwjTovA" },
        { icon: "🏢", label: "MASTER PROYEK PPBL 2026", href: "https://docs.google.com/spreadsheets/d/1pVh735Ig9Ch20dfa6zVQSSX3kFN-BZ_jrbQD2DoR8X4" },
        { icon: "🥽", label: "VIRTUAL TOUR 360 BANGUNAN (ON PROGRESS) ", href: "https://ppblnumberone-creator.github.io/Virtual-tour-gresik-v2/" }
      ]
    }
  ];

  // ================== ELEMEN AUDIO & TOMBOL MUSIK ==================
  const musicBtn = document.getElementById("musicBtn");
  const bgMusic = document.getElementById("bgMusic");
  const iconPlay = document.getElementById("iconPlay");
  const iconPause = document.getElementById("iconPause");

  function showPlayingUI(){
    iconPlay.style.display = "none";
    iconPause.style.display = "block";
    musicBtn.classList.add("playing");
  }

  function showPausedUI(){
    iconPlay.style.display = "block";
    iconPause.style.display = "none";
    musicBtn.classList.remove("playing");
  }

  // ================== NAVIGASI: HOME (hexagon) <-> DETAIL ==================
  const hero = document.getElementById("hero");
  const homeView = document.getElementById("homeView");
  const detailView = document.getElementById("detailView");
  const hexGrid = document.getElementById("hexGrid");
  const backBtn = document.getElementById("backBtn");

  const detailLogo = document.getElementById("detailLogo");
  const detailTitle = document.getElementById("detailTitle");
  const detailSubtitle = document.getElementById("detailSubtitle");
  const detailLinks = document.getElementById("detailLinks");
  const detailFooter = document.getElementById("detailFooter");

  let currentSegment = null;

  function setHero(url){
    hero.style.opacity = 0;
    setTimeout(() => {
      hero.style.backgroundImage =
        `linear-gradient(180deg,rgba(7,27,58,.05),rgba(7,27,58,.35)), url("${url}")`;
      document.body.style.setProperty("--hero-bg-url", `url("${url}")`);
      hero.style.opacity = 1;
    }, 180);
  }

  function buildHexGrid(){
    hexGrid.innerHTML = segments.map(seg => `
      <button class="hex-item" type="button" data-id="${seg.id}" aria-label="Buka ${seg.hexLabel}">
        <span class="hex-shape"><img src="${seg.logo}" alt="Logo ${seg.hexLabel}"></span>
        <span class="hex-label">${seg.hexLabel}</span>
      </button>
    `).join("");

    hexGrid.querySelectorAll(".hex-item").forEach(btn => {
      btn.addEventListener("click", () => openSegment(btn.dataset.id));
    });
  }

  function openSegment(id){
    const seg = segments.find(s => s.id === id);
    if (!seg) return;
    currentSegment = seg;

    detailLogo.src = seg.logo;
    detailLogo.alt = "Logo " + seg.hexLabel;
    detailTitle.textContent = seg.title;
    detailSubtitle.textContent = seg.subtitle;
    detailFooter.textContent = seg.footer;
    detailLinks.innerHTML = seg.links.map(l => `
      <a class="link-btn" href="${l.href}" target="_blank" rel="noopener">
        <span class="icon">${l.icon}</span>
        <span>${l.label}</span>
      </a>
    `).join("");

    setHero(seg.hero);

    // lanjutkan musik ke lagu segmen ini kalau sedang main
    const wasPlaying = !bgMusic.paused;
    if (bgMusic.getAttribute("src") !== seg.audio){
      bgMusic.setAttribute("src", seg.audio);
      if (wasPlaying){
        bgMusic.play().then(showPlayingUI).catch(showPausedUI);
      }
    }

    homeView.style.display = "none";
    detailView.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goHome(){
    currentSegment = null;
    homeView.style.display = "block";
    detailView.style.display = "none";
    setHero(segments[0].hero);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  backBtn.addEventListener("click", goHome);

  buildHexGrid();
  setHero(segments[0].hero);

  // ================== MUSIK: interaksi tombol & autoplay ==================
  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (bgMusic.paused) {
      if (!bgMusic.getAttribute("src")) bgMusic.setAttribute("src", (currentSegment || segments[0]).audio);
      bgMusic.play().then(showPlayingUI).catch(showPausedUI);
    } else {
      bgMusic.pause();
      showPausedUI();
    }
  });

  // Autoplay saat pengguna pertama kali mengklik area mana saja di halaman
  document.addEventListener("click", () => {
    if (bgMusic.paused) {
      if (!bgMusic.getAttribute("src")) bgMusic.setAttribute("src", (currentSegment || segments[0]).audio);
      bgMusic.play().then(showPlayingUI).catch(() => {});
    }
  }, { once: true });

  // ================== PENGHITUNG & REKAP HARIAN PENGUNJUNG (Supabase) ==================
  // Setiap kunjungan dicatat lewat 1 pemanggilan fungsi database (RPC) yang atomik:
  // dalam SATU eksekusi yang sama, +1 ke "total sepanjang waktu" DAN +1 ke "hari ini".
  // Tidak ada logika "unique visitor per sesi" seperti analytics tool (GoatCounter dkk) —
  // ini murni angka mentah, jadi dijamin: total selalu = jumlah semua angka harian.
  //
  // WAJIB DIISI — cuma 2 nilai, ambil dari dashboard Supabase-mu:
  //   Project Settings (ikon gerigi) -> API -> "Project URL" dan "anon public" key.
  const SUPABASE_URL = "https://kvcnbyasnvpmnrbvkjjg.supabase.co";      // contoh: https://xxxxx.supabase.co
  const SUPABASE_ANON_KEY = "sb_publishable_J9EFLRjCWE9gaLgsQLKeLQ_x-Wwu3wF";       // key panjang, aman dipasang di frontend

  // WAJIB DIJALANKAN SEKALI di Supabase -> menu "SQL Editor" -> New query -> paste
  // semua isi blok SQL di bawah ini -> klik Run. (Ini komentar, bukan kode JS yang jalan.)
  /*
    create table visit_total (
      id int primary key default 1,
      count bigint not null default 0
    );
    insert into visit_total (id, count) values (1, 0);

    create table visit_daily (
      day date primary key,
      count bigint not null default 0
    );

    create or replace function record_visit()
    returns void
    language plpgsql
    security definer
    as $$
    begin
      update visit_total set count = count + 1 where id = 1;
      insert into visit_daily (day, count) values (current_date, 1)
        on conflict (day) do update set count = visit_daily.count + 1;
    end;
    $$;

    alter table visit_total enable row level security;
    alter table visit_daily enable row level security;
    create policy "publik boleh baca total" on visit_total for select using (true);
    create policy "publik boleh baca harian" on visit_daily for select using (true);
    -- catatan: publik TIDAK diberi izin insert/update langsung ke tabel;
    -- satu-satunya jalan menambah angka adalah lewat fungsi record_visit() di atas,
    -- dan fungsi ini SELALU menambah total & harian bersamaan, jadi tidak akan pernah
    -- nyimpang seperti kasus GoatCounter kemarin.
  */

  const HARI_DITAMPILKAN = 7; // jumlah hari ke belakang yang direkap di tabel

  function formatTanggalID(isoDate){
    const [y, m, d] = isoDate.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }

  (function initVisitorBadge(){
    const countEl = document.getElementById("visitorCount");
    const totalDetailEl = document.getElementById("visitorTotalDetail");
    const tableBody = document.getElementById("visitorTableBody");
    const counterBtn = document.getElementById("visitorCounter");
    const panel = document.getElementById("visitorPanel");

    // Panel bisa dibuka/tutup lewat klik badge, terlepas dari Supabase siap atau belum
    counterBtn.addEventListener("click", () => {
      counterBtn.classList.toggle("open");
      panel.classList.toggle("open");
    });

    const isConfigured = !SUPABASE_URL.startsWith("GANTI_") && !SUPABASE_ANON_KEY.startsWith("GANTI_");
    if (!isConfigured){
      countEl.textContent = "-";
      if (totalDetailEl) totalDetailEl.textContent = "-";
      if (tableBody) tableBody.innerHTML = '<tr><td colspan="2">SUPABASE_URL / KEY belum diisi</td></tr>';
      console.error("Isi dulu SUPABASE_URL dan SUPABASE_ANON_KEY di kode sebelum badge pengunjung bisa jalan.");
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const todayKey = new Date().toLocaleDateString("sv-SE"); // format YYYY-MM-DD lokal

    async function fetchTotal(){
      const { data, error } = await sb.from("visit_total").select("count").eq("id", 1).single();
      if (error) console.error("Supabase (visit_total):", error.message);
      const total = (!error && data) ? data.count : "-";
      countEl.textContent = (typeof total === "number") ? total.toLocaleString("id-ID") : total;
      if (totalDetailEl) totalDetailEl.textContent = countEl.textContent;
    }

    async function fetchDailyRecap(){
      if (!tableBody) return;
      const { data, error } = await sb
        .from("visit_daily")
        .select("day, count")
        .order("day", { ascending: false })
        .limit(HARI_DITAMPILKAN);

      if (error) console.error("Supabase (visit_daily):", error.message);
      if (error || !data || data.length === 0){
        tableBody.innerHTML = '<tr><td colspan="2">Belum ada data</td></tr>';
        return;
      }
      tableBody.innerHTML = data.map(row => `
        <tr>
          <td>${formatTanggalID(row.day)}${row.day === todayKey ? " (hari ini)" : ""}</td>
          <td>${Number(row.count).toLocaleString("id-ID")}</td>
        </tr>
      `).join("");
    }

    async function recordAndLoad(){
      const { error } = await sb.rpc("record_visit"); // +1 total & +1 hari ini, dalam 1 transaksi database
      if (error) console.error("Supabase (record_visit):", error.message, "— pastikan sudah menjalankan SQL setup di SQL Editor.");
      await fetchTotal();
      await fetchDailyRecap();
    }

    recordAndLoad();
  })();
</script>
