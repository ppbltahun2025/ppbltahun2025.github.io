<!doctype html>
<html lang="id" class="home-mode">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b3a">
  <meta name="description" content="Daftar link serbaguna SIMBG DAN PPBL Gresik.">
  <title>KENDATI</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2710424249080203"
     crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-2710424249080203">

  <script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>
  <!-- Favicon (logo tab browser) -->
  <link rel="icon" type="image/png" href="assets/icon-menu.png">
  <link rel="apple-touch-icon" href="KENDATI%20APPS/icons/apple-touch-icon.png">
  <!-- Bisa dipasang sebagai aplikasi (Android/iPhone), tampil penuh tanpa bar browser -->
  <link rel="manifest" href="KENDATI%20APPS/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KENDATI">

  <style>
    :root{
      /* ============================================================
         PENTING: GANTI baris --hero-home-img di bawah dengan baris
         ASLI milikmu (url("data:image/svg+xml;base64,....") yang
         panjang itu). Saya tidak menyalin base64 raksasa tersebut
         supaya tidak ada karakter yang rusak. Selama belum diganti,
         background halaman hanya gradasi biru gelap.
         ============================================================ */
      --hero-home-img: none;
      --navy:#071b3a;
      --blue:#0b4b91;
      --gold:#f0b429;
      --cream:#f6f3ea;
      --text:#10213b;
    }

    *{box-sizing:border-box}

    html{ height:100%; }

    body{
      margin:0;
      min-height:100vh;
      font-family:"Segoe UI",Arial,sans-serif;
      color:#fff;
      background:
        linear-gradient(180deg,rgba(4,15,32,.42),rgba(4,15,32,.92)),
        var(--hero-bg-url, var(--hero-home-img)) center center/cover fixed no-repeat;
      padding:0 16px 38px;
      transition:background-image .5s ease;
      overflow-x:hidden;
    }

    /* ===== Halaman Home: dikunci pas 1 layar penuh, TIDAK PERNAH scroll,
       di zoom berapa pun. Kalau kepanjangan, JS (fitHomeToViewport)
       menyusutkannya (transform:scale) supaya tetap muat. ===== */
    html.home-mode, body.home-mode{
      height:100%;
      overflow:hidden;
    }
    body.home-mode{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px 16px;
    }

    /* ===== Halaman Detail: kartu di ATAS, foto hero di BAWAH ===== */
    body:not(.home-mode){
      display:flex;
      flex-direction:column;
    }
    body:not(.home-mode) .view-wrap{
      order:1;
      margin:20px auto 0;
    }
    body:not(.home-mode) .hero-wrap{
      order:2;
      margin:18px auto 0;
    }
    body:not(.home-mode) .logo-wrap:not(.pill){
      margin-top:0;
    }

    /* ===== HERO / kolase foto — HANYA di halaman detail ===== */
    .hero-wrap{
      position:relative;
      width:min(1100px,100%);
      height:clamp(230px,42vw,540px);
      margin:0 auto;
    }

    .hero{
      position:absolute;
      inset:0;
      border-radius:0 0 28px 28px;
      overflow:hidden;
      box-shadow:0 16px 45px rgba(0,0,0,.30);
      background:
        linear-gradient(180deg,rgba(7,27,58,.05),rgba(7,27,58,.35)),
        var(--hero-bg-url) center center/cover no-repeat;
      opacity:1;
      transition:opacity .55s ease, background-image .1s linear;
    }

    body.home-mode .hero-wrap{
      display:none;
    }

    /* ===== Kartu Home: lebar dibatasi selebar logo KENDATI
       supaya latar animasi terlihat jelas di kiri & kanan ===== */
    body.home-mode .view-wrap{
      margin:0 auto;
      max-width:380px;   /* selebar logo KENDATI; ubah angka ini untuk menyesuaikan */
      max-height:100%;
    }
    body.home-mode .logo-wrap.pill{
      width:100%;        /* logo pil mengisi lebar kartu */
    }

    /* ===== Wrapper kartu (Home & Detail) ===== */
    .view-wrap{
      width:100%;
      max-width:480px;
      margin:-36px auto 0;
      position:relative;
      z-index:2;
      transition:margin-top .3s ease, opacity .26s ease;
    }

    .card{
      position:relative;
      text-align:center;
      padding:28px 20px 20px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:24px;
      background:rgba(7,27,58,.88);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 18px 45px rgba(0,0,0,.35);
      overflow:visible;
      animation:fadeIn .35s ease;
    }

    /* Jarak atas kartu Home = jarak copyright ke tepi bawah */
    #homeView{
      padding-top:28px;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(6px)}
      to{opacity:1; transform:translateY(0)}
    }

    /* ===== Latar Home: HANYA foto slideshow dari assets/background ===== */
    body.home-mode{background:#061631}

    /* ===== ORB: logo lingkaran di tengah layar.
       Posisi & ukuran TIDAK PERNAH berubah, baik saat menu tertutup
       maupun terbuka. Klik 1x = buka, klik 1x lagi = tutup. ===== */
    .home-orb{
      position:fixed;
      top:50%; left:50%;
      /* ukuran orb = lebar hexagon (diisi JS lewat --orb) */
      width:var(--orb,96px); height:var(--orb,96px);
      margin:calc(var(--orb,96px) / -2) 0 0 calc(var(--orb,96px) / -2);
      padding:0;
      border:none;
      border-radius:50%;
      background:var(--cream);
      display:none;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:5;
      box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 5px rgba(255,255,255,.18);
      transition:transform .45s cubic-bezier(.34,1.56,.64,1), opacity .3s ease, box-shadow .3s ease;
    }
    body.home-mode .home-orb{display:flex}
    .home-orb img{width:76%; height:76%; object-fit:contain; pointer-events:none}
    .home-orb::before{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:50%;
      border:2px solid rgba(240,180,41,.6);
      animation:hubPulse 2.4s ease-out infinite;
      transition:border-color .5s ease;
    }
    /* cincin gelombang sekali jalan saat menu dibuka */
    .home-orb::after{
      content:"";
      position:absolute;
      inset:-4px;
      border-radius:50%;
      border:2px solid rgba(240,180,41,.85);
      opacity:0;
      pointer-events:none;
    }
    .home-orb:hover{
      transform:scale(1.08);
      box-shadow:0 14px 34px rgba(0,0,0,.55), 0 0 0 5px rgba(240,180,41,.6);
    }
    .home-orb:active{transform:scale(.94)}
    /* orb TETAP tampil di tengah layar saat menu terbuka;
       cincin denyut memudar halus (bukan hilang mendadak) */
    body.home-open .home-orb::before{border-color:transparent}
    body.home-open .home-orb::after{animation:orbBurst 1s cubic-bezier(.22,1,.36,1) both}
    body.home-open .home-orb{
      box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 5px rgba(240,180,41,.6);
    }
    /* saat pindah halaman Home <-> Detail, orb ikut memudar */
    body.leaving .home-orb{opacity:0; pointer-events:none}
    @keyframes orbBurst{
      0%{transform:scale(1); opacity:.9}
      100%{transform:scale(3.4); opacity:0}
    }

    /* ===== Kartu Home: biru TRANSPARAN, terbuka seperti LINGKARAN MELEBAR dari orb =====
       Memakai clip-path (bukan scale) supaya halus: blur tidak ikut
       mengecil/membesar dan bentuk sudut kartu tidak berubah-ubah.
       --hy = titik pusat hub, --r = radius penuh (keduanya diisi JS). */
    #homeView{
      --hy:50%;
      --r:700px;
      background:rgba(7,27,58,.42);
      -webkit-backdrop-filter:blur(10px);
      backdrop-filter:blur(10px);
      border-color:rgba(255,255,255,.28);
      animation:none;
      clip-path:circle(var(--r) at 50% var(--hy));
      will-change:clip-path;
      transition:clip-path .95s cubic-bezier(.22,1,.36,1), visibility 0s linear 0s;
    }
    #homeView.closed{
      clip-path:circle(46px at 50% var(--hy));
      visibility:hidden;
      pointer-events:none;
      transition:clip-path .6s cubic-bezier(.65,0,.35,1), visibility 0s linear .6s;
    }

    /* isi kartu muncul berurutan (naik pelan + memudar), keluar lebih cepat */
    #homeView .logo-wrap,
    #homeView h1,
    #homeView .subtitle,
    #homeView footer{
      opacity:0;
      transform:translateY(14px);
      transition:opacity .2s ease, transform .25s ease;
    }
    #homeView.open .logo-wrap,
    #homeView.open h1,
    #homeView.open .subtitle,
    #homeView.open footer{
      opacity:1;
      transform:none;
      transition:opacity .6s ease var(--d,0s), transform .8s cubic-bezier(.22,1,.36,1) var(--d,0s);
    }
    #homeView .logo-wrap{--d:.30s}
    #homeView h1{--d:.38s}
    #homeView .subtitle{--d:.44s}
    #homeView footer{--d:.70s}
    #homeView h1,
    #homeView .subtitle,
    #homeView footer{text-shadow:0 1px 6px rgba(0,0,0,.65)}

    /* ===== SLIDESHOW LATAR (foto JPEG, ganti tiap 5 detik) =====
       Dua lapis saling bertukar: crossfade + blur-ke-tajam + zoom pelan (Ken Burns).
       Berada di bawah lapis ::before (cahaya & grid) dan ::after (gedung). */
    #bgSlides{
      position:fixed;
      inset:0;
      z-index:-2;
      overflow:hidden;
      pointer-events:none;
      display:none;
      background:#061631;
    }
    body.home-mode #bgSlides{display:block}
    .bg-slide{
      position:absolute;
      inset:-4%;
      background-position:center center;
      background-size:cover;
      background-repeat:no-repeat;
      opacity:0;
      z-index:1;
      transform:scale(1.02);
      transition:opacity 2s ease-in-out;   /* samakan dengan FADE_MS di JS */
      will-change:opacity, transform;
      backface-visibility:hidden;
    }
    /* foto yang baru masuk berada DI ATAS foto lama, lalu memudar masuk.
       Foto lama tetap 100% terlihat sampai tertutup penuh, jadi tidak ada
       momen layar menggelap di tengah pergantian. */
    .bg-slide.front{z-index:2}
    .bg-slide.show{opacity:1}
    /* Ken Burns (zoom pelan). Animasi TIDAK dilepas dari foto yang sedang keluar,
       supaya foto lama tidak "melompat" kembali ke ukuran awal saat memudar. */
    .bg-slide.kb{animation:bgZoom 9s linear forwards}
    .bg-slide.alt.kb{animation-name:bgZoomAlt}
    @keyframes bgZoom{
      from{transform:scale(1.02) translate3d(0,0,0)}
      to  {transform:scale(1.08) translate3d(-1%,-.6%,0)}
    }
    @keyframes bgZoomAlt{
      from{transform:scale(1.08) translate3d(1%,.6%,0)}
      to  {transform:scale(1.02) translate3d(0,0,0)}
    }
    @media (prefers-reduced-motion:reduce){
      .bg-slide.kb{animation:none}
    }

    /* ===== Logo tunggal (lingkaran, halaman detail) ===== */
    .logo-wrap{
      width:96px;
      height:96px;
      margin:-24px auto 10px;
      border-radius:50%;
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      box-shadow:0 8px 18px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.12);
      flex-shrink:0;
    }

    /* ===== Logo Home: pil memanjang ===== */
    .logo-wrap.pill{
      width:min(320px, 82%);
      height:auto;
      aspect-ratio:2.93 / 1;
      margin:0 auto 12px;
      border-radius:999px;
      background:var(--cream);
      padding:8px 14px;
    }
    .logo-wrap.pill .logo{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    .logo{
      width:82%;
      height:82%;
      object-fit:contain;
      display:block;
    }

    h1{
      color:#ffd873;
      font-size:21px;
      margin:8px 0 6px;
    }

    .subtitle{
      color:#eaf1ff;
      font-size:13.5px;
      line-height:1.55;
      margin:0 0 22px;
      opacity:.94;
    }

    footer{
      margin-top:18px;
      color:rgba(255,255,255,.62);
      font-size:11.5px;
    }

    /* ===== Tombol kembali (halaman detail) ===== */
    .back-btn{
      position:absolute;
      top:16px;
      left:16px;
      z-index:5;
      display:flex;
      align-items:center;
      justify-content:center;
      width:36px;
      height:36px;
      background:rgba(255,255,255,.12);
      border:1px solid rgba(255,255,255,.35);
      color:#eaf1ff;
      font-size:16px;
      border-radius:50%;
      cursor:pointer;
      transition:background .18s ease, transform .18s ease;
    }
    .back-btn:hover{background:rgba(255,255,255,.22); transform:translateX(-2px)}

    /* ===== HONEYCOMB GRID (halaman detail) ===== */
    .hex-grid{
      position:relative;
      margin:6px auto 10px;
    }

    .hex-item{
      appearance:none;
      background:none;
      border:none;
      padding:9% 15%;
      box-sizing:border-box;
      position:absolute;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:4px;
      color:inherit;
      font:inherit;
      text-decoration:none;
      cursor:pointer;
      z-index:1;
      transition:transform .2s cubic-bezier(.165,.84,.44,1), z-index 0s;
    }
    .hex-item:focus-visible{
      outline:2px solid var(--gold);
      outline-offset:3px;
    }
    .hex-item:hover{
      transform:scale(1.08);
      z-index:2;
    }

    .hex-shape{
      position:absolute;
      inset:0;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background:var(--cream);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 10px 22px rgba(0,0,0,.35);
      transition:box-shadow .2s ease, background .2s ease;
    }
    .hex-item:hover .hex-shape{
      box-shadow:0 14px 28px rgba(0,0,0,.5);
    }

    .hex-img{
      position:relative;
      z-index:1;
      width:120%;
      max-height:120%;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
    }

    .hex-icon{
      position:relative;
      z-index:1;
      font-size:22px;
      line-height:1;
      flex:0 0 auto;
    }
    .hex-icon-img{
      position:relative;
      z-index:1;
      width:30px;
      height:30px;
      object-fit:contain;
      display:block;
      flex:0 0 auto;
    }
    .hex-label{
      position:relative;
      z-index:1;
      margin-top:0;
      font-size:10.5px;
      font-weight:700;
      color:var(--blue);
      line-height:1.15;
      text-align:center;
      padding:0 4px;
      transition:color .2s ease;
      flex:0 0 auto;
    }
    .hex-item:hover .hex-label{
      color:var(--gold);
    }

    /* ===== Hub animatif Home =====
       Susunan 3 panel (jarak 120°): SIMBG kiri-atas, PPBL kanan-atas,
       DLL bawah. Pusat hub ditaruh di --hub-cy supaya panel bawah muat.
       Elemen .home-hub kini TIDAK TAMPIL (yang tampil adalah orb tetap
       di tengah layar); ia hanya jadi titik acuan posisi hexagon. */
    .home-hub-wrap{
      --hub-cy:114px;
      position:relative;
      width:100%;
      max-width:340px;
      height:290px;          /* diisi ulang oleh JS (layoutHub) */
      margin:4px auto 4px;
    }
    .home-hub{
      position:absolute;
      top:var(--hub-cy); left:50%;
      width:112px; height:112px;
      margin:-56px 0 0 -56px;
      visibility:hidden;
      pointer-events:none;
      border-radius:50%;
      z-index:5;
    }
    .home-hub-item{
      appearance:none;
      background:none;
      border:none;
      padding:0;
      position:absolute;
      top:var(--hub-cy); left:50%;
      width:96px; height:110px;
      margin:-55px 0 0 -48px;
      z-index:3;
      cursor:pointer;
      transform:translate(0,0) scale(.2);
      opacity:0;
      pointer-events:none;
      /* menutup: cepat, tertarik kembali ke orb */
      transition:transform .35s cubic-bezier(.55,0,.55,.2), opacity .25s ease;
    }
    /* membuka: hexagon "meletup" keluar dari bawah orb satu per satu (efek pegas) */
    #homeView.open .home-hub-item{
      transform:translate(var(--tx), var(--ty)) scale(1);
      opacity:1;
      pointer-events:auto;
      transition:
        transform .75s cubic-bezier(.34,1.56,.64,1) calc(.3s + var(--delay,0s)),
        opacity .4s ease calc(.3s + var(--delay,0s));
    }
    @media (prefers-reduced-motion:reduce){
      #homeView, #homeView *{
        transition-duration:.01s !important;
        transition-delay:0s !important;
      }
      .home-orb::after{display:none}
    }
    @keyframes hubPulse{
      0%{transform:scale(1); opacity:.55}
      75%{transform:scale(1.4); opacity:0}
      100%{opacity:0}
    }
    .home-hub-shape{
      position:relative;
      width:100%; height:100%;
      clip-path:polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      background:linear-gradient(160deg,#0c3a6e,var(--gold) 55%,#0e5aa8);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:6px; padding:10px;
      box-shadow:0 10px 22px rgba(0,0,0,.4);
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, background .25s ease;
    }
    .home-hub-item:hover .home-hub-shape,
    .home-hub-item:focus-visible .home-hub-shape{
      transform:scale(1.1);
      background:linear-gradient(160deg,#0e5aa8,var(--gold) 140%);
      box-shadow:0 14px 28px rgba(0,0,0,.5);
    }
    .home-hub-item-img{
      width:60%; max-height:44%;
      object-fit:contain;
    }
    .home-hub-item-label{
      font-size:10.5px;
      font-weight:700;
      color:#eaf1ff;
      text-align:center;
      line-height:1.2;
      padding:0 2px;
      transition:color .2s ease;
    }
    .home-hub-item:hover .home-hub-item-label{
      color:#08182e;
    }
    @media (max-width:600px){
      .home-hub-item{width:86px;height:98px;margin:-49px 0 0 -43px}
    }

    .music-btn{
      position:fixed;
      top:16px;
      right:16px;
      width:40px;
      height:40px;
      border-radius:50%;
      background:rgba(7,27,58,.55);
      -webkit-backdrop-filter:blur(12px);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.26);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      z-index:999;
      box-shadow:0 6px 20px rgba(0,0,0,.28);
      transition:background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .music-btn:hover{background:rgba(7,27,58,.72); border-color:rgba(240,180,41,.65); transform:scale(1.05)}
    .music-btn svg{width:18px;height:18px;fill:#ffd873}
    .music-btn.playing{animation:pulse 1.5s infinite ease-in-out}

    @keyframes pulse{
      0%,100%{box-shadow:0 0 0 0 rgba(240,180,41,.45)}
      50%{box-shadow:0 0 0 8px rgba(240,180,41,0)}
    }

    /* ===== Badge & panel pengunjung: kaca biru + aksen emas, senada kartu menu ===== */
    .visitor-counter{
      position:fixed;
      top:16px;
      left:16px;
      display:flex;
      align-items:center;
      gap:8px;
      background:rgba(7,27,58,.55);
      -webkit-backdrop-filter:blur(12px);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,.26);
      color:#fff;
      font-size:12.5px;
      font-weight:600;
      padding:8px 14px 8px 11px;
      border-radius:999px;
      box-shadow:0 6px 20px rgba(0,0,0,.28);
      z-index:999;
      white-space:nowrap;
      cursor:pointer;
      user-select:none;
      transition:background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .visitor-counter:hover{background:rgba(7,27,58,.72); border-color:rgba(240,180,41,.65)}
    .visitor-counter:active{transform:scale(.97)}
    .visitor-counter .v-icon{display:flex; color:var(--gold)}
    .visitor-counter .v-icon svg{width:16px; height:16px}
    .visitor-counter .v-label{opacity:.78; font-weight:500}
    .visitor-counter .v-count{color:#ffd873; font-weight:800; font-variant-numeric:tabular-nums}
    .visitor-counter .v-caret{opacity:.6; font-size:10px; transition:transform .25s ease}
    .visitor-counter.open .v-caret{transform:rotate(180deg)}

    .visitor-panel{
      position:fixed;
      top:64px;
      left:16px;
      /* tidak boleh menutupi orb di tengah layar: maks. setengah layar - jari-jari orb */
      width:min(560px, max(300px, calc(50vw - 94px)), calc(100vw - 32px));
      padding:14px 14px 12px;
      background:rgba(7,27,58,.66);
      -webkit-backdrop-filter:blur(16px) saturate(120%);
      backdrop-filter:blur(16px) saturate(120%);
      border:1px solid rgba(255,255,255,.24);
      border-radius:20px;
      color:#fff;
      box-shadow:0 18px 40px rgba(0,0,0,.4);
      z-index:998;

  // ================== ELEMEN AUDIO & TOMBOL MUSIK ==================
  const musicBtn = document.getElementById("musicBtn");

  const iconPause = document.getElementById("iconPause");

  function showPlayingUI(){
    iconPlay.style.display = "none";
    iconPause.style.display = "block";
    musicBtn.classList.add("playing");
  }

  function showPausedUI(){
    iconPlay.style.display = "block";
    iconPause.style.display = "none";
    musicBtn.classList.remove("playing");
  }

  // ================== NAVIGASI: HOME <-> DETAIL ==================
  const hero = document.getElementById("hero");
  const homeView = document.getElementById("homeView");
  const detailView = document.getElementById("detailView");
  const hexGrid = document.getElementById("hexGrid");
  const backBtn = document.getElementById("backBtn");

  const detailLogo = document.getElementById("detailLogo");
  const detailTitle = document.getElementById("detailTitle");
  const detailSubtitle = document.getElementById("detailSubtitle");
  const detailLinks = document.getElementById("detailLinks");
  const detailFooter = document.getElementById("detailFooter");

  let currentSegment = null; // null = sedang di Home

  function setHero(url){
    hero.style.opacity = 0;
    setTimeout(() => {
      hero.style.backgroundImage =
        `linear-gradient(180deg,rgba(7,27,58,.05),rgba(7,27,58,.35)), url("${url}")`;
      document.body.style.setProperty("--hero-bg-url", `url("${url}")`);
      hero.style.opacity = 1;
    }, 180);
  }

  function switchAudio(newSrc){
    const wasPlaying = !bgMusic.paused;
    if (bgMusic.getAttribute("src") !== newSrc){
      bgMusic.setAttribute("src", newSrc);
      if (wasPlaying){
        bgMusic.play().then(showPlayingUI).catch(showPausedUI);
      }
    }
  }

  // ================== HONEYCOMB (halaman detail) ==================
  function chunkIntoRows(items, perRow){
    const rows = [];
    for (let i = 0; i < items.length; i += perRow){
      rows.push(items.slice(i, i + perRow));
    }
    return rows;
  }

  function computeHexWidth(containerEl, perRow){
    const available = containerEl.clientWidth || 300;
    const w = available / (perRow + 0.5);
    return Math.max(58, Math.min(112, Math.floor(w)));
  }

  function layoutHoneycomb(containerEl, items, itemHtmlFn, perRow){
    const hexW = computeHexWidth(containerEl, perRow);
    const hexH = hexW / (Math.sqrt(3) / 2);
    const colStep = hexW;
    const rowStep = hexH * 0.75;
    const offsetX = hexW / 2;

    const rows = chunkIntoRows(items, perRow);
    const hasOffsetRow = rows.length > 1;

    let totalWidth = 0;
    rows.forEach((row, r) => {
      const rowOffset = (hasOffsetRow && r % 2 === 1) ? offsetX : 0;
      const rowWidth = row.length * colStep + rowOffset;
      if (rowWidth > totalWidth) totalWidth = rowWidth;
    });
    const totalHeight = (rows.length - 1) * rowStep + hexH;

    containerEl.style.width = totalWidth + "px";
    containerEl.style.height = totalHeight + "px";

    containerEl.innerHTML = rows.map((row, r) => row.map((item, c) => {
      const x = c * colStep + (hasOffsetRow && r % 2 === 1 ? offsetX : 0);
      const y = r * rowStep;
      return itemHtmlFn(item, x, y, hexW, hexH);
    }).join("")).join("");
  }

  // ---- Hub animatif Home ----
  // Susunan 3 layanan, jarak 120° antar panel (sumbu Y layar mengarah ke bawah):
  //   SIMBG = kiri-atas (210°), PPBL = kanan-atas (330°), DLL = bawah (90°)
  const ANGLE_BY_ID = { simbg: 210, ppbl: 330, dll: 90 };

  function buildHexGrid(){
    const HUB_ICON = "assets/icon-menu.png";
    const n = segments.length;
    const startAngle = (n === 2) ? 180 : -90; // cadangan kalau ada layanan baru

    const items = segments.map((seg, i) => {
      const angleDeg = (ANGLE_BY_ID[seg.id] !== undefined)
        ? ANGLE_BY_ID[seg.id]
        : startAngle + (360 / n) * i;
      return `
        <button class="home-hub-item" type="button" data-id="${seg.id}" data-angle="${angleDeg}"
                aria-label="Buka ${seg.hexLabel}"
                style="--delay:${(i * 0.07).toFixed(2)}s">
          <span class="home-hub-shape">
            <img class="home-hub-item-img" src="${seg.logo}" alt="Logo ${seg.hexLabel}">
            <span class="home-hub-item-label">${seg.hexLabel}</span>
          </span>
        </button>
      `;
    }).join("");

    // .home-hub disembunyikan (CSS); hanya jadi titik acuan posisi hexagon.
    // Yang tampil di tengah layar adalah orb tetap (#homeOrb).
    hexGrid.innerHTML = `
      <div class="home-hub" id="homeHub" aria-hidden="true">
        <img src="${HUB_ICON}" alt="">
      </div>
      ${items}
    `;

    hexGrid.querySelectorAll(".home-hub-item").forEach(btn => {
      btn.addEventListener("click", () => openSegment(btn.dataset.id));
    });

    fitHomeToViewport();
  }

  // ================== HOME: muat 1 layar, TANPA SCROLL ==================
  // Kartu digeser supaya titik tengah hub tepat berada di tengah layar,
  // sama persis dengan posisi orb. Kartu juga mekar dari titik itu.
  // ---- Jarak hexagon dari orb, supaya TIDAK PERNAH bertabrakan ----
  // Orb di layar selalu 112px (+ cincin denyut 10px), sedangkan kartu bisa
  // menyusut (scale). Maka jarak hexagon dihitung ulang mengikuti scale.
  // Orb dibuat SAMA BESAR dengan hexagon (diameter = lebar hexagon) dan
  // hexagon diletakkan mepet ke orb. Ukuran orb ikut scale kartu.
  const ORB_RING = 5;   // cincin tipis (box-shadow) di sekeliling orb
  const ORB_GAP  = 6;   // celah antara cincin orb dan ujung hexagon

  function layoutHub(radius){
    const items = hexGrid.querySelectorAll(".home-hub-item");
    if (!items.length) return;
    const hexH = items[0].offsetHeight;   // ukuran asli, tidak terpengaruh transform
    const orbR = items[0].offsetWidth / 2 + ORB_RING;
    let up = orbR, down = orbR;
    items.forEach(el => {
      const rad = Number(el.dataset.angle) * Math.PI / 180;
      const tx = Math.round(Math.cos(rad) * radius);
      const ty = Math.round(Math.sin(rad) * radius);
      el.style.setProperty("--tx", tx + "px");
      el.style.setProperty("--ty", ty + "px");
      up   = Math.max(up,   -ty + hexH / 2);
      down = Math.max(down,  ty + hexH / 2);
    });
    // tinggi area hub & posisi pusatnya menyesuaikan jarak hexagon
    hexGrid.style.setProperty("--hub-cy", Math.ceil(up + 6) + "px");
    hexGrid.style.height = Math.ceil(up + down + 12) + "px";
  }

  function fitHomeToViewport(){
    const wrap = document.querySelector(".view-wrap");
    wrap.style.transform = "none";
    if (!document.body.classList.contains("home-mode")) return;

    if (homeView.style.display === "none") return;
    const hub = document.getElementById("homeHub");
    if (!hub) return;

    const firstItem = hexGrid.querySelector(".home-hub-item");
    const hexHalf = firstItem ? firstItem.offsetHeight / 2 : 55;   // ujung hexagon mengarah ke orb
    const hexW    = firstItem ? firstItem.offsetWidth : 96;
    const orbEl   = document.getElementById("homeOrb");
    // jarak pusat orb -> ujung hexagon (dalam ukuran kartu), sesuai scale
    const radiusFor = (sc) => hexW / 2 + (ORB_RING + ORB_GAP) / sc + hexHalf;

    const pad = 20;
    const availW = window.innerWidth - pad * 2;
    const availH = window.innerHeight - pad * 2;
    let scale = 1, hubY = 0, w = 0, h = 0;

    // radius bergantung pada scale, scale bergantung pada tinggi kartu:
    // diulang beberapa kali sampai stabil
    for (let k = 0; k < 4; k++){
      layoutHub(radiusFor(scale));
      hubY = hexGrid.offsetTop + hub.offsetTop + hub.offsetHeight / 2;
      w = wrap.offsetWidth;
      h = wrap.offsetHeight;
      const next = Math.min(
        1,
        availW / w,
        availH / (2 * Math.max(hubY, h - hubY))
      );
      if (Math.abs(next - scale) < 0.005){ scale = next; break; }
      scale = next;
    }
    layoutHub(radiusFor(scale));
    hubY = hexGrid.offsetTop + hub.offsetTop + hub.offsetHeight / 2;
    h = wrap.offsetHeight;
    if (orbEl) orbEl.style.setProperty("--orb", (hexW * scale).toFixed(1) + "px");   // orb = lebar hexagon di layar

    // geser supaya pusat hub = pusat layar (sama dengan orb)
    // titik & radius lingkaran pembuka kartu (clip-path), dari pusat hub
    const reveal = Math.hypot(w / 2, Math.max(hubY, h - hubY)) + 90;
    homeView.style.setProperty("--hy", hubY + "px");
    homeView.style.setProperty("--r", Math.ceil(reveal) + "px");

    const dy = hubY - h / 2;
    const ty = -scale * dy;

    if (scale < 0.999 || Math.abs(ty) > 0.5){
      wrap.style.transformOrigin = "center center";
      wrap.style.transform = `translateY(${ty}px) scale(${scale})`;
    }

    // Orb ditempel tepat di titik pusat hub yang sebenarnya (bukan "tengah layar"),
    // karena di HP tinggi layar berubah-ubah saat bar alamat browser muncul/hilang.
    placeOrbOnHub();
  }

  const SUPABASE_URL = "https://kvcnbyasnvpmnrbvkjjg.supabase.co";

  // tab Harian: semua tanggal di bulan berjalan (1 s/d 28/29/30/31)

  const NAMA_BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const NAMA_BULAN_PANJANG = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

  function formatTanggalID(isoDate){
    const [y, m, d] = isoDate.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });

  // angka ringkas untuk label di atas batang: 12.500 -> 12,5rb
  function angkaRingkas(n){
    if (n >= 1e6) return (n / 1e6).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + "jt";
    if (n >= 1e4) return (n / 1e3).toLocaleString("id-ID", { maximumFractionDigits: 1 }) + "rb";
    return n.toLocaleString("id-ID");
  }

  // batas atas sumbu Y yang "bulat" (4 garis bantu): 1-2-5 x 10^n
  function skalaAtas(max){
    if (max <= 4) return 4;
    const raw = max / 4;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
    return step * 4;
  }

  (function initVisitorBadge(){
    const countEl = document.getElementById("visitorCount");
    const totalDetailEl = document.getElementById("visitorTotalDetail");
    const chartEl = document.getElementById("visitorChart");
    const rangeEl = document.getElementById("visitorRange");
    const counterBtn = document.getElementById("visitorCounter");
    const panel = document.getElementById("visitorPanel");
    const tabs = {
      daily:   document.getElementById("tabDaily"),
      monthly: document.getElementById("tabMonthly"),
      yearly:  document.getElementById("tabYearly")
    };

    counterBtn.addEventListener("click", () => {
      const willOpen = !panel.classList.contains("open");
      counterBtn.classList.toggle("open", willOpen);
      panel.classList.toggle("open", willOpen);
      // statistik dibuka saat menu KENDATI sedang terbuka -> tutup menunya
      if (willOpen && homeView.classList.contains("open")) closeHome();
    });
    // klik di luar panel atau tekan Escape = tutup
    function closePanel(){
      counterBtn.classList.remove("open");
      panel.classList.remove("open");
    }
    document.addEventListener("click", (e) => {
      if (!panel.contains(e.target) && !counterBtn.contains(e.target)) closePanel();
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

    let activeTab = "daily";
    let dailyMap = new Map();     // "YYYY-MM-DD" -> jumlah
    let monthlyMap = new Map();   // "YYYY-MM-01" -> jumlah
    let loaded = false;

    // ---- gambar grafik kolom mendatar ----
    // items: [{ label, sub, value, red, today, muted, title }]
    function chartHtml(items){
      const max = Math.max(0, ...items.map(i => i.value));
      const top = skalaAtas(max);

      let grid = "";
      for (let k = 0; k <= 4; k++){
        const val = top * k / 4;
        grid += `<div class="vchart-grid${k === 0 ? " base" : ""}" style="bottom:${k * 25}%">
                   <span>${angkaRingkas(val)}</span></div>`;
      }

      const cols = items.map((it, i) => {
        const h = it.value > 0 ? Math.max(1.5, it.value / top * 100) : 0;
        return `<div class="vcol${it.today ? " today" : ""}" title="${it.title}">
                  <div class="vcol-bar" style="height:${h}%; --i:${i}">
                    ${it.value > 0 ? `<span class="vcol-val">${angkaRingkas(it.value)}</span>` : ""}
                  </div>
                </div>`;
      }).join("");

      const xs = items.map(it => {
        const cls = ["vx", it.red ? "red" : "", it.muted ? "muted" : "", it.today ? "today" : ""].join(" ").trim();
        return `<div class="${cls}"><b>${it.label}</b>${it.sub ? `<small>${it.sub}</small>` : ""}</div>`;
      }).join("");

      const dense = items.length > 14 ? " dense" : "";
      return `<div class="vchart-plot${dense}">${grid}<div class="vchart-cols">${cols}</div></div>
              <div class="vchart-x${dense}">${xs}</div>`;
    }

    function setRange(text, total){
      rangeEl.innerHTML = `<span>${text}</span><b>${total.toLocaleString("id-ID")} pengunjung</b>`;
    }

    function renderDaily(){
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth();
      const jumlahHari = new Date(y, m + 1, 0).getDate();   // 28 / 29 / 30 / 31
      const items = [];
      for (let tgl = 1; tgl <= jumlahHari; tgl++){
        const d = new Date(y, m, tgl);
        const key = keyTanggal(d);
        const dow = d.getDay();
        const v = dailyMap.get(key) || 0;
        const isToday = tgl === now.getDate();
        items.push({
          label: tgl,
          sub: KODE_HARI[dow],
          value: v,
          red: dow === 0 || dow === 6,          // Minggu & Sabtu merah
          today: isToday,
          title: `${NAMA_HARI[dow]}, ${formatTanggalID(key)}${isToday ? " (hari ini)" : ""}: ${v.toLocaleString("id-ID")} pengunjung`
        });
      }
      const total = items.reduce((a, b) => a + b.value, 0);
      setRange(`${NAMA_BULAN_PANJANG[m]} ${y}`, total);
      chartEl.innerHTML = chartHtml(items);
    }

    function renderMonthly(){
      const now = new Date();
      const year = now.getFullYear();
      const items = NAMA_BULAN.map((nama, m) => {
        const v = monthlyMap.get(`${year}-${pad2(m + 1)}-01`) || 0;
        return {
          label: nama,
          value: v,
          today: m === now.getMonth(),
          muted: m > now.getMonth(),
          title: `${NAMA_BULAN_PANJANG[m]} ${year}: ${v.toLocaleString("id-ID")} pengunjung`
        };
      });
      setRange(`Tahun ${year}`, items.reduce((a, b) => a + b.value, 0));
      chartEl.innerHTML = chartHtml(items);
    }

    function renderYearly(){
      // dijumlah dari tabel visit_monthly, jadi tidak perlu tabel baru
      const perYear = new Map();
      monthlyMap.forEach((v, key) => {
        const y = Number(key.slice(0, 4));
        perYear.set(y, (perYear.get(y) || 0) + v);
      });
      const thisYear = new Date().getFullYear();
      const firstYear = perYear.size ? Math.min(...perYear.keys(), thisYear) : thisYear;
      const items = [];
      for (let y = firstYear; y <= thisYear; y++){
        const v = perYear.get(y) || 0;
        items.push({
          label: y,
          value: v,
          today: y === thisYear,
          title: `Tahun ${y}: ${v.toLocaleString("id-ID")} pengunjung`
        });
      }
      setRange(items.length > 1 ? `${firstYear} – ${thisYear}` : `Tahun ${thisYear}`,
               items.reduce((a, b) => a + b.value, 0));
      chartEl.innerHTML = chartHtml(items);
    }

    function render(){
      if (!loaded) return;
      if (activeTab === "daily") renderDaily();
      else if (activeTab === "monthly") renderMonthly();
      else renderYearly();
    }

    function setActiveTab(tab){
      activeTab = tab;
      Object.entries(tabs).forEach(([k, el]) => el.classList.toggle("active", k === tab));
      render();
    }
    Object.entries(tabs).forEach(([k, el]) => el.addEventListener("click", () => setActiveTab(k)));

    const isConfigured = !SUPABASE_URL.startsWith("GANTI_") && !SUPABASE_ANON_KEY.startsWith("GANTI_");
    if (!isConfigured){
      countEl.textContent = "-";
      if (totalDetailEl) totalDetailEl.textContent = "-";
      rangeEl.innerHTML = "<span>SUPABASE_URL / KEY belum diisi</span><b></b>";
      chartEl.innerHTML = '<div class="vchart-empty">Belum ada data</div>';
      console.error("Isi dulu SUPABASE_URL dan SUPABASE_ANON_KEY di kode sebelum badge pengunjung bisa jalan.");
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchTotal(){
      const { data, error } = await sb.from("visit_total").select("count").eq("id", 1).single();
      if (error) console.error("Supabase (visit_total):", error.message);
      const total = (!error && data) ? Number(data.count) : "-";
      countEl.textContent = (typeof total === "number") ? total.toLocaleString("id-ID") : total;
      if (totalDetailEl) totalDetailEl.textContent = countEl.textContent;
    }

    async function fetchDaily(){
      const now = new Date();
      const since = keyTanggal(new Date(now.getFullYear(), now.getMonth(), 1));   // tanggal 1 bulan ini
      const { data, error } = await sb
        .from("visit_daily")
        .select("day, count")
        .gte("day", since)
        .order("day", { ascending: true });
      if (error) console.error("Supabase (visit_daily):", error.message);
      dailyMap = new Map((!error && data ? data : []).map(r => [r.day, Number(r.count) || 0]));
    }

    async function fetchMonthly(){
      // semua bulan (tabel kecil: 12 baris per tahun) -> dipakai tab Bulanan & Tahunan
      const { data, error } = await sb
        .from("visit_monthly")
        .select("month, count")
        .order("month", { ascending: true })
        .limit(1200);
      if (error) console.error("Supabase (visit_monthly):", error.message, "— pastikan sudah menjalankan SQL setup tabel visit_monthly.");
      monthlyMap = new Map((!error && data ? data : []).map(r => [String(r.month).slice(0, 10), Number(r.count) || 0]));
    }

    async function recordAndLoad(){
      const { error } = await sb.rpc("record_visit");
      if (error) console.error("Supabase (record_visit):", error.message, "— pastikan sudah menjalankan SQL setup di SQL Editor.");
      await Promise.all([fetchTotal(), fetchDaily(), fetchMonthly()]);
      loaded = true;
      render();
    }

    recordAndLoad();
  })();
</script>

<script>

  (function initBgSlideshow(){

    const CACHE_TTL  = 10 * 60 * 1000;   // daftar dari GitHub dianggap baru selama 10 menit

    // DAFTAR PASTI, tidak bergantung pada GitHub API (API ini dibatasi 60 permintaan/jam
    // per alamat IP, jadi bisa gagal di jaringan kantor yang dipakai banyak orang).
    // Kalau menambah foto baru ke folder assets/background, tulis juga namanya di sini.
    const KNOWN_FILES = [
      "WhatsApp Image 2026-11-17 at 17.09.07.jpeg",
      "Untitled.jpg",
      "RSGS.jpg",
      "DJI_0487.JPG",
      "DJI_0421.JPG"
    ];
    const IMG_EXT = /\.(jpe?g|png|webp|avif)$/i;

    const layers = [document.getElementById("bgSlideA"), document.getElementById("bgSlideB")];
    if (!layers[0] || !layers[1]) return;

    let urls = [];
    let index = -1;
    let front = 1;      // lapis yang sedang tampil di depan (awal: B, jadi foto pertama masuk ke A)
    let timer = null;

    const delay = (ms, val) => new Promise(r => setTimeout(() => r(val), ms));
    const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });

    // ---- daftar file: GitHub API (cache 10 menit) + daftar pasti ----
    function readCache(){
      try {
        const c = JSON.parse(sessionStorage.getItem(CACHE_KEY) || "null");
        if (c && Date.now() - c.t < CACHE_TTL && Array.isArray(c.files)) return c.files;
      } catch(e){}
      return null;
    }
    function writeCache(files){
      try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), files })); } catch(e){}
    }

    async function loadFileList(){
      let api = readCache();
      if (!api){
        try {
          const res = await fetch(GITHUB_API, { headers: { "Accept": "application/vnd.github+json" } });
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          api = data
            .filter(f => f.type === "file" && IMG_EXT.test(f.name))
            .map(f => ({ name: f.name, size: f.size || 0 }));
          writeCache(api);
        } catch(err){
          console.warn("Slideshow: daftar GitHub gagal dimuat, memakai KNOWN_FILES.", err);
          api = [];

      }

      // gabungkan: semua dari API + yang ada di KNOWN_FILES tapi belum ada di API
      const byName = new Map();
      api.forEach(f => byName.set(f.name, f.size));
      KNOWN_FILES.forEach(n => { if (!byName.has(n)) byName.set(n, 0); });

      // foto pertama = yang paling kecil (cepat tampil), sisanya urut nama
      const names = [...byName.keys()];
      const sized = names.filter(n => byName.get(n) > 0).sort((a, b) => byName.get(a) - byName.get(b));
      const first = sized.length ? sized[0] : KNOWN_FILES.find(n => byName.has(n));
      const rest  = names.filter(n => n !== first).sort(natural);
      return first ? [first, ...rest] : rest;
    }

    // ---- muat + decode dulu SEBELUM tampil, supaya tidak patah saat transisi ----

          const d = img.decode ? img.decode() : Promise.resolve();
          d.then(() => resolve(true), () => resolve(true));
        };
        img.onerror = () => resolve(false);
        img.src = url;
      });
      loaded.set(url, p);
      p.then(ok => { if (!ok) loaded.delete(url); });   // yang gagal boleh dicoba lagi nanti
      return p;
    }

    // ---- crossfade: foto baru naik ke depan, foto lama baru dimatikan setelah tertutup ----
    function crossfadeTo(url){
      const incoming = layers[1 - front];
      const outgoing = layers[front];

      clearTimeout(incoming._t);
      incoming.style.backgroundImage = `url("${url}")`;
      incoming.classList.remove("show", "kb");
      incoming.classList.add("front");
      outgoing.classList.remove("front");
      void incoming.offsetWidth;                 // mulai ulang animasi zoom dari awal
      incoming.classList.add("kb", "show");

      outgoing._t = setTimeout(() => outgoing.classList.remove("show"), FADE_MS + 250);
      front = 1 - front;
    }

    async function showNext(){
      if (!urls.length) return false;
      for (let tries = 0; tries < urls.length; tries++){
        const cand = (index + 1) % urls.length;
        const url = urls[cand];
        const ok = await Promise.race([preload(url), delay(LOAD_LIMIT, false)]);
        index = cand;
        if (!ok) continue;            // gagal / terlalu lambat: lewati (yang lambat tetap diunduh di latar)
        crossfadeTo(url);
        if (urls.length > 1) preload(urls[(index + 1) % urls.length]);   // siapkan foto berikutnya
        return true;
      }
      return false;
    }

    function schedule(){
      stop();
      timer = setTimeout(async () => {
        // hemat memori & data: jangan ganti foto saat sedang di halaman Detail
        if (document.body.classList.contains("home-mode")) await showNext();
        schedule();
      }, INTERVAL);
    }
    function start(){ schedule(); }
    function stop(){
      if (timer){ clearTimeout(timer); timer = null; }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) stop(); else if (urls.length > 1) start();
    });

    (async function(){
      const files = await loadFileList();
      urls = files.map(name => BG_BASE + encodeURIComponent(name));
      console.info("Slideshow: " + urls.length + " foto", files);
      if (!urls.length){
        console.warn("Slideshow: tidak ada foto. Isi KNOWN_FILES atau cek folder assets/background.");
        return;
      }
      await showNext();                 // foto pertama (yang terkecil) langsung tampil
      if (urls.length > 1) start();
    })();
  })();
</script>
