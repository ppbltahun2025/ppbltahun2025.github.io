    /* ===== Reveal-from-logo (teknik Kedaton), khusus grid layanan Home ===== */
    .hex-launcher{ position:relative; }

    /* Kuncinya di sini: sebelum di-hover/tap, #hexGrid dikunci setinggi 0
       (overflow disembunyikan) supaya TIDAK menyisakan area kosong besar
       di bawah logo. Begitu terbuka, max-height dibesarkan barengan
       dengan item-item yang mekar keluar. */
    #hexGrid{
      max-height: 0;
      overflow: hidden;
      transition: max-height .5s ease;
    }
    .hex-launcher:hover #hexGrid,
    .hex-launcher.open #hexGrid{
      max-height: 360px; /* cukup untuk 2–6 hex, naikkan kalau item makin banyak/berbaris */
    }

    .hex-launcher #hexGrid .hex-item{
      transform: translateY(-80px) scale(.35);
      opacity: 0;
      pointer-events: none;
      transition:
        transform .5s cubic-bezier(.34,1.56,.64,1),
        opacity .3s ease;
    }

    /* delay bertahap tiap item supaya "mekar" satu-satu, bukan bareng.
       nth-child dihitung dari urutan item di array `segments`. */
    .hex-launcher #hexGrid .hex-item:nth-child(1){ transition-delay:.03s }
    .hex-launcher #hexGrid .hex-item:nth-child(2){ transition-delay:.10s }
    .hex-launcher #hexGrid .hex-item:nth-child(3){ transition-delay:.17s }
    .hex-launcher #hexGrid .hex-item:nth-child(4){ transition-delay:.24s }

    /* trigger: hover (desktop) ATAU class "open" dari JS (tap di HP) */
    .hex-launcher:hover #hexGrid .hex-item,
    .hex-launcher.open #hexGrid .hex-item{
      transform: translateY(0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }
    /* biar efek hover-membesar item tetap jalan SETELAH item terbuka */
    .hex-launcher:hover #hexGrid .hex-item:hover,
    .hex-launcher.open #hexGrid .hex-item:hover{
      transform: translateY(0) scale(1.08);
      z-index: 2;
    }

      hero.style.opacity = 1;
    }, 180);
  }

  function switchAudio(newSrc){
    const wasPlaying = !bgMusic.paused;
    if (bgMusic.getAttribute("src") !== newSrc){
      bgMusic.setAttribute("src", newSrc);
      if (wasPlaying){
        bgMusic.play().then(showPlayingUI).catch(showPausedUI);
      }
    }
  }

  function chunkIntoRows(items, perRow){
    const rows = [];
    for (let i = 0; i < items.length; i += perRow){
      rows.push(items.slice(i, i + perRow));
    }
    return rows;
  }

  function computeHexWidth(containerEl, perRow){
    const available = containerEl.clientWidth || 300;
    const w = available / (perRow + 0.5);
    return Math.max(58, Math.min(112, Math.floor(w)));
  }

  function layoutHoneycomb(containerEl, items, itemHtmlFn, perRow){
    const hexW = computeHexWidth(containerEl, perRow);
    const hexH = hexW / (Math.sqrt(3) / 2);
    const colStep = hexW;
    const rowStep = hexH * 0.75;
    const offsetX = hexW / 2;

    const rows = chunkIntoRows(items, perRow);
    const hasOffsetRow = rows.length > 1;

    let totalWidth = 0;
    rows.forEach((row, r) => {
      const rowOffset = (hasOffsetRow && r % 2 === 1) ? offsetX : 0;
      const rowWidth = row.length * colStep + rowOffset;
      if (rowWidth > totalWidth) totalWidth = rowWidth;
    });
    const totalHeight = (rows.length - 1) * rowStep + hexH;

    containerEl.style.width = totalWidth + "px";
    containerEl.style.height = totalHeight + "px";

    containerEl.innerHTML = rows.map((row, r) => row.map((item, c) => {
      const x = c * colStep + (hasOffsetRow && r % 2 === 1 ? offsetX : 0);
      const y = r * rowStep;
      return itemHtmlFn(item, x, y, hexW, hexH);
    }).join("")).join("");
  }

  function buildHexGrid(){
    const perRow = Math.min(3, segments.length) || 1;
    layoutHoneycomb(hexGrid, segments, (seg, x, y, w, h) => `
      <button class="hex-item" type="button" data-id="${seg.id}" aria-label="Buka ${seg.hexLabel}"
              style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
       
        <img class="hex-img" src="${seg.logo}" alt="Logo ${seg.hexLabel}" onerror="this.style.display='none'">
        <span class="hex-label">${seg.hexLabel}</span>
      </button>
    `, perRow);

    hexGrid.querySelectorAll(".hex-item").forEach(btn => {
      btn.addEventListener("click", () => openSegment(btn.dataset.id));
    });

    fitHomeToViewport();
  }

  function fitHomeToViewport(){
    if (!document.body.classList.contains("home-mode")) return;

    homeView.style.transform = "none";

    const pad = 20;
    const availW = window.innerWidth - pad * 2;
    const availH = window.innerHeight - pad * 2;
    const rect = homeView.getBoundingClientRect();

    const scale = Math.min(1, availW / rect.width, availH / rect.height);

    if (scale < 0.999) {
      homeView.style.transformOrigin = "center center";
      homeView.style.transform = `scale(${scale})`;
    } else {
      homeView.style.transform = "none";
    }
  }

  function buildLinkHexGrid(seg){
    const perRow = seg.links.length <= 4 ? 2 : 3;
    layoutHoneycomb(detailLinks, seg.links, (l, x, y, w, h) => `
      <a class="hex-item" href="${l.href}" target="_blank" rel="noopener" aria-label="${l.label}"
         style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
        
        <span class="hex-icon">${l.icon}</span>
        <span class="hex-label">${l.label}</span>
      </a>
    `, perRow);
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (currentSegment) buildLinkHexGrid(currentSegment);
      else buildHexGrid();
      fitHomeToViewport();
    }, 150);
  });

  function openSegment(id){
    const seg = segments.find(s => s.id === id);
    if (!seg) return;
    currentSegment = seg;

    detailLogo.src = seg.logo;
    detailLogo.alt = "Logo " + seg.hexLabel;
    detailTitle.textContent = seg.title;
    detailSubtitle.textContent = seg.subtitle;
    detailFooter.textContent = seg.footer;
    buildLinkHexGrid(seg);

    document.body.classList.remove("home-mode");
    document.documentElement.classList.remove("home-mode");
    setHero(seg.hero);
    switchAudio(seg.audio);

    homeView.style.display = "none";
    detailView.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function goHome(){
    currentSegment = null;
    homeView.style.display = "block";
    detailView.style.display = "none";
    document.body.classList.add("home-mode");
    document.documentElement.classList.add("home-mode");
    document.body.style.removeProperty("--hero-bg-url");
    switchAudio(HOME.audio);
    window.scrollTo({ top: 0, behavior: "smooth" });
    fitHomeToViewport();
  }

  backBtn.addEventListener("click", goHome);

  buildHexGrid();

  // Tap-to-toggle untuk HP/tablet (desktop sudah cukup pakai :hover di CSS)
  const hexLauncher = document.getElementById("hexLauncher");
  const logoCore = document.getElementById("logoCore");
  if (hexLauncher && logoCore){
    logoCore.addEventListener("click", (e) => {
      e.stopPropagation();
      hexLauncher.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!hexLauncher.contains(e.target)) hexLauncher.classList.remove("open");
    });
  }

  window.addEventListener("load", fitHomeToViewport);
  const homeLogoImg = document.getElementById("homeLogo");
  if (homeLogoImg) homeLogoImg.addEventListener("load", fitHomeToViewport);

  musicBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    if (bgMusic.paused) {
      if (!bgMusic.getAttribute("src")) bgMusic.setAttribute("src", (currentSegment || HOME).audio);
      bgMusic.play().then(showPlayingUI).catch(showPausedUI);
    } else {
      bgMusic.pause();
      showPausedUI();
    }
  });

  document.addEventListener("click", () => {
    if (bgMusic.paused) {
      if (!bgMusic.getAttribute("src")) bgMusic.setAttribute("src", (currentSegment || HOME).audio);
      bgMusic.play().then(showPlayingUI).catch(() => {});
    }
  }, { once: true });

  const SUPABASE_URL = "https://kvcnbyasnvpmnrbvkjjg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_J9EFLRjCWE9gaLgsQLKeLQ_x-Wwu3wF";

  const HARI_DITAMPILKAN = 7;
  const BULAN_DITAMPILKAN = 6;

  function formatTanggalID(isoDate){
    const [y, m, d] = isoDate.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
  }

  function formatBulanID(isoMonth){
    const [y, m] = isoMonth.split("-").map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  }

  (function initVisitorBadge(){
    const countEl = document.getElementById("visitorCount");
    const totalDetailEl = document.getElementById("visitorTotalDetail");
    const tableBody = document.getElementById("visitorTableBody");
    const colHead = document.getElementById("visitorColHead");
    const counterBtn = document.getElementById("visitorCounter");
    const panel = document.getElementById("visitorPanel");
    const tabDaily = document.getElementById("tabDaily");
    const tabMonthly = document.getElementById("tabMonthly");

    counterBtn.addEventListener("click", () => {
      counterBtn.classList.toggle("open");
      panel.classList.toggle("open");
    });

    let activeTab = "daily";
    let dailyRows = [];
    let monthlyRows = [];

    function renderTable(){
      if (activeTab === "daily"){
        colHead.textContent = "Tanggal";
        tableBody.innerHTML = dailyRows.length
          ? dailyRows.map(row => `
              <tr>
                <td>${formatTanggalID(row.day)}${row.day === todayKey ? " (hari ini)" : ""}</td>
                <td>${Number(row.count).toLocaleString("id-ID")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="2">Belum ada data</td></tr>';
      } else {
        colHead.textContent = "Bulan";
        tableBody.innerHTML = monthlyRows.length
          ? monthlyRows.map(row => `
              <tr>
                <td>${formatBulanID(row.month)}</td>
                <td>${Number(row.count).toLocaleString("id-ID")}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="2">Belum ada data</td></tr>';
      }
    }

    function setActiveTab(tab){
      activeTab = tab;
      tabDaily.classList.toggle("active", tab === "daily");
      tabMonthly.classList.toggle("active", tab === "monthly");
      renderTable();
    }

    tabDaily.addEventListener("click", () => setActiveTab("daily"));
    tabMonthly.addEventListener("click", () => setActiveTab("monthly"));

    const isConfigured = !SUPABASE_URL.startsWith("GANTI_") && !SUPABASE_ANON_KEY.startsWith("GANTI_");
    if (!isConfigured){
      countEl.textContent = "-";
      if (totalDetailEl) totalDetailEl.textContent = "-";
      tableBody.innerHTML = '<tr><td colspan="2">SUPABASE_URL / KEY belum diisi</td></tr>';
      console.error("Isi dulu SUPABASE_URL dan SUPABASE_ANON_KEY di kode sebelum badge pengunjung bisa jalan.");
      return;
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const todayKey = new Date().toLocaleDateString("sv-SE");

    async function fetchTotal(){
      const { data, error } = await sb.from("visit_total").select("count").eq("id", 1).single();
      if (error) console.error("Supabase (visit_total):", error.message);
      const total = (!error && data) ? data.count : "-";
      countEl.textContent = (typeof total === "number") ? total.toLocaleString("id-ID") : total;
      if (totalDetailEl) totalDetailEl.textContent = countEl.textContent;
    }

    async function fetchDailyRecap(){
      const { data, error } = await sb
        .from("visit_daily")
        .select("day, count")
        .order("day", { ascending: false })
        .limit(HARI_DITAMPILKAN);

      if (error) console.error("Supabase (visit_daily):", error.message);
      dailyRows = (!error && data) ? data : [];
      renderTable();
    }

    async function fetchMonthlyRecap(){
      const { data, error } = await sb
        .from("visit_monthly")
        .select("month, count")
        .order("month", { ascending: false })
        .limit(BULAN_DITAMPILKAN);

      if (error) console.error("Supabase (visit_monthly):", error.message, "— pastikan sudah menjalankan SQL setup tabel visit_monthly.");
      monthlyRows = (!error && data) ? data : [];
      renderTable();
    }

    async function recordAndLoad(){
      const { error } = await sb.rpc("record_visit");
      if (error) console.error("Supabase (record_visit):", error.message, "— pastikan sudah menjalankan SQL setup di SQL Editor.");
      await fetchTotal();
      await fetchDailyRecap();
      await fetchMonthlyRecap();
    }

    recordAndLoad();
  })();
</script>
