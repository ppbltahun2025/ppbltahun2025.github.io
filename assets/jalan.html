<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jelajah Landmark Dunia 3D</title>
<style>
:root{--fg:#fff;--panel:rgba(15,20,35,.62);--acc:#ffb84d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;overflow:hidden;background:#87b8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg)}
canvas{display:block;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.ui{position:fixed;left:0;right:0;pointer-events:none;padding:12px}
.top{top:env(safe-area-inset-top,0px)}.bot{bottom:env(safe-area-inset-bottom,0px)}
.card{pointer-events:auto;background:var(--panel);backdrop-filter:blur(10px);border-radius:14px;padding:12px 16px;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
h1{margin:0 0 2px;font-size:20px}.loc{font-size:12px;color:var(--acc);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase}
p{margin:0;font-size:13px;line-height:1.5;opacity:.92}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto;margin-top:8px}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 14px;cursor:pointer;transition:.2s}
button:hover{background:rgba(255,255,255,.2)}button.on{background:var(--acc);color:#222;border-color:var(--acc);font-weight:600}
.hint{text-align:center;font-size:12px;opacity:.85;text-shadow:0 1px 3px #000}
#joy{display:none;position:fixed;left:20px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:var(--panel);border:1px solid rgba(255,255,255,.3);touch-action:none;pointer-events:auto}
#joy i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--acc);opacity:.9}
</style>
</head>
<body>
<div class="ui top"><div class="card"><div class="loc" id="loc"></div><h1 id="nm"></h1><p id="ds"></p></div></div>
<div class="ui bot">
<div class="hint" id="hintEl">Seret untuk mengelilingi · Scroll / cubit untuk zoom</div>
<div id="joy"><i></i></div>
<div class="row" id="nav"></div>
<div class="row"><button id="bAuto" class="on">⟳ Putar Otomatis</button><button id="bNight">🌙 Mode Malam</button><button id="bWalk">🚶 Mode Jalan</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,V=(x,y,z)=>new T.Vector3(x,y,z);

const scene=new T.Scene(),cam=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,500);

// bintang

sg.setAttribute('position',new T.Float32BufferAttribute(sp,3));

for(let i=0;i<10;i++){const c=new T.Group();for(let j=0;j<4;j++){const s=new T.Mesh(new T.SphereGeometry(2+Math.random()*2,10,8),new T.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.85}));s.position.set(j*2.5,Math.random(),Math.random()*2);c.add(s)}
c.position.set((Math.random()-.5)*160,35+Math.random()*15,(Math.random()-.5)*160);clouds.add(c)}

function beam(a,b,t,m,p){const d=b.clone().sub(a),l=d.length(),o=new T.Mesh(new T.BoxGeometry(t,l,t),m);
o.position.copy(a.clone().add(b).multiplyScalar(.5));o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());o.castShadow=true;(p||cur).add(o)}

const L=[
{id:'eiffel',n:'Menara Eiffel',l:'Paris, Prancis',d:'Dibangun tahun 1889 oleh Gustave Eiffel. Tingginya sekitar 330 m dan terbuat dari besi tempa.',dist:46,ty:12,

mesh(new T.CylinderGeometry(.25,.5,5,8),m,0,36.5,0);mesh(new T.ConeGeometry(.25,5,8),m,0,41.5,0);
for(const s of[-1,1]){beam(V(s*7,0,-7),V(s*7,0,7),.5,m);beam(V(-7,0,s*7),V(7,0,s*7),.5,m)}
const a=new T.Mesh(new T.TorusGeometry(5,.35,6,20,Math.PI),m);a.position.set(0,1.5,7);a.castShadow=true;cur.add(a);
const sc=1;cur.scale.setScalar(.5)}},
{id:'giza',n:'Piramida Agung Giza',l:'Giza, Mesir',d:'Dibangun sekitar 2560 SM untuk Firaun Khufu. Selama lebih dari 3.800 tahun, ini adalah bangunan tertinggi di dunia.',dist:55,ty:5,
build(){ground(0xd9b878,60);const m=M(0xe2c48a,{roughness:1});

for(let i=0;i<3;i++)mesh(new T.CylinderGeometry(.2,.2,.1,8),m,0,0,0);

mesh(new T.BoxGeometry(6,2,2),sm,0,1,0,s);mesh(new T.BoxGeometry(1.4,1.8,1.4),sm,-2.6,2.7,0,s);mesh(new T.BoxGeometry(2.2,.5,2.2),sm,-2.6,3.7,0,s)}},

build(){ground(0x7bb86a,35);const w=M(0xf1ece0,{roughness:.9}),d=M(0x3a3028);
const t=new T.Group();t.rotation.z=-.07;cur.add(t);
for(let i=0;i<7;i++){const y=i*1.9+.95;mesh(new T.CylinderGeometry(2.1,2.2,1.9,32),w,0,y,0,t);
if(i>0)for(let k=0;k<16;k++){const a=k/16*6.283;mesh(new T.CylinderGeometry(.14,.14,1.5,6),w,Math.cos(a)*2.4,y,Math.sin(a)*2.4,t);}
mesh(new T.CylinderGeometry(2.45,2.45,.25,32),w,0,i*1.9+1.9,0,t)}
mesh(new T.CylinderGeometry(1.4,1.6,1.6,24),w,0,14.2,0,t);mesh(new T.ConeGeometry(1.5,.8,24),M(0xa05a3a),0,15.3,0,t);
for(let k=0;k<10;k++){const a=k/10*6.283;mesh(new T.BoxGeometry(.35,.9,.1),d,Math.cos(a)*2.2,1+(k%3)*3.8,Math.sin(a)*2.2,t).rotation.y=-a+1.57}
mesh(new T.BoxGeometry(18,5,5),w,-4,2.5,-12);mesh(new T.CylinderGeometry(2.8,2.8,.2,24),M(0x9a4a3a),-4,5.2,-12).scale.set(2,1,.8);
mesh(new T.SphereGeometry(2.5,20,12,0,6.283,0,1.57),M(0x8a8a90),-4,5,-12)}},
{id:'taj',n:'Taj Mahal',l:'Agra, India',d:'Mausoleum marmer putih yang dibangun 1632–1653 oleh Shah Jahan untuk istrinya, Mumtaz Mahal.',dist:42,ty:6,
build(){ground(0x8fbf7a,45);const w=M(0xfaf5ec,{roughness:.35}),a=M(0xe8dfcf,{roughness:.5});
mesh(new T.BoxGeometry(22,1.2,22),M(0xd8cfc0),0,.6,0);mesh(new T.BoxGeometry(12,1,12),a,0,1.7,0);
mesh(new T.BoxGeometry(8,6,8),w,0,5.2,0);mesh(new T.BoxGeometry(2.6,4,.4),M(0x2a2a3a),0,4.5,4.1);
const dome=mesh(new T.SphereGeometry(3,32,20,0,6.283,0,1.7),w,0,8.2,0);dome.scale.y=1.3;
mesh(new T.CylinderGeometry(.08,.08,2.2,8),M(0xd4a017,{metalness:.8}),0,13,0);
mesh(new T.CylinderGeometry(3.1,3.1,.8,32),w,0,8.2,0);
for(const[sx,sz]of[[-1,-1],[1,-1],[1,1],[-1,1]]){mesh(new T.CylinderGeometry(.5,.6,8,20),w,sx*5.2,5.6,sz*5.2)
mesh(new T.SphereGeometry(.7,16,10,0,6.283,0,1.57),w,sx*5.2,9.9,sz*5.2);mesh(new T.CylinderGeometry(.65,.65,.2,16),a,sx*5.2,8.8,sz*5.2);
mesh(new T.SphereGeometry(.9,16,10,0,6.283,0,1.57),w,sx*3.1,6,sz*3.1).scale.y=1.2}
const pool=mesh(new T.BoxGeometry(2.6,.1,24),M(0x4aa8d8,{roughness:.05,metalness:.6}),0,.08,18);
for(let i=0;i<5;i++)mesh(new T.ConeGeometry(.7,3,8),M(0x2f6a35),i%2?-3.5:3.5,1.5,13+i*3.5)}},
{id:'burj',n:'Burj Khalifa',l:'Dubai, Uni Emirat Arab',d:'Gedung tertinggi di dunia dengan tinggi 828 m dan 163 lantai, selesai dibangun pada 2010.',dist:60,ty:20,
build(){ground(0xc8b48a,45);const g=M(0x9fc4e8,{metalness:.9,roughness:.12});
let y=0;const secs=[[4,3.2,8],[3.4,2.7,8],[2.9,2.3,7],[2.5,1.9,6],[2.1,1.6,6],[1.8,1.3,5],[1.5,1.1,5],[1.2,.9,4]];
secs.forEach(([a,b,h],i)=>{const c=mesh(new T.CylinderGeometry(b,a,h,6+(i%2?0:0)),g,0,y+h/2,0);c.rotation.y=i*.5;
for(let k=0;k<3;k++){const w=mesh(new T.BoxGeometry(.9,h,a*1.5),g,0,y+h/2,0);w.rotation.y=k*Math.PI/3+i*.5}y+=h});
mesh(new T.CylinderGeometry(.08,.7,10,10),g,0,y+5,0);mesh(new T.BoxGeometry(3,.2,.1),g,0,y+2,0);
for(let i=0;i<6;i++){const a=i/6*6.283;mesh(new T.BoxGeometry(2.5,5+i%3*3,2.5),M(0x7a8aa0,{metalness:.7,roughness:.3}),Math.cos(a)*14,(5+i%3*3)/2,Math.sin(a)*14)}
cur.scale.setScalar(.55)}},
{id:'monas',n:'Monumen Nasional (Monas)',l:'Jakarta, Indonesia',d:'Tugu setinggi 132 m di Medan Merdeka, Jakarta. Puncaknya dilapisi lidah api emas sebagai lambang semangat perjuangan bangsa.',dist:62,ty:16,mr:9,wr:40,
build(){ground(0x7ec06a,50);const w=M(0xf4f1ea,{roughness:.4}),gold=M(0xffc82e,{metalness:.9,roughness:.25,emissive:0x8a5a00,emissiveIntensity:.5});
mesh(new T.BoxGeometry(34,.15,34),M(0x4aa8d8,{roughness:.1,metalness:.5}),0,.1,0);
mesh(new T.BoxGeometry(24,.8,24),M(0xcfcac0),0,.4,0);mesh(new T.BoxGeometry(18,1.2,18),w,0,1.4,0);mesh(new T.BoxGeometry(12,3,12),w,0,3.5,0);
const o=mesh(new T.CylinderGeometry(1.1,1.7,22,4),w,0,16,0);o.rotation.y=Math.PI/4;
mesh(new T.BoxGeometry(4.4,.4,4.4),w,0,27.2,0);mesh(new T.BoxGeometry(3,1.4,3),M(0xddd8cc),0,28,0);mesh(new T.BoxGeometry(4.4,.4,4.4),w,0,28.9,0);
const f=mesh(new T.SphereGeometry(1.2,20,14),gold,0,31,0);f.scale.y=1.6;mesh(new T.ConeGeometry(.8,2.2,12),gold,0,33,0);
for(let i=0;i<16;i++){const a=i/16*6.283;tree(Math.cos(a)*27,Math.sin(a)*27)}}},
{id:'tugu',n:'Tugu Pahlawan',l:'Surabaya, Jawa Timur',d:'Monumen setinggi 41,15 m dengan badan beralur sepuluh lengkung, mengenang Pertempuran 10 November 1945 dan para pejuang Surabaya.',dist:50,ty:15,mr:5,
build(){ground(0x7ab35f,42);const w=M(0xdedad0,{roughness:.8,flatShading:true});
mesh(new T.CylinderGeometry(16,16,.2,48),M(0xd9d4c8,{roughness:1}),0,.1,0);mesh(new T.CylinderGeometry(7,7.4,.6,10),M(0xc8c3b6),0,.5,0);mesh(new T.CylinderGeometry(5.4,5.8,1,10),w,0,1.3,0);
mesh(new T.CylinderGeometry(1,2.4,28,10),w,0,16,0);
for(let i=0;i<11;i++){const y=1.8+(i+.5)*28/11,r=2.4-1.4*(y-1.8)/28+.03,t=mesh(new T.TorusGeometry(r,.13,6,10),M(0xb8b3a6),0,y,0);t.rotation.x=Math.PI/2}
mesh(new T.ConeGeometry(1,2.4,10),w,0,31.2,0);
for(let i=0;i<10;i++){const a=i/10*6.283;mesh(new T.BoxGeometry(1.6,1.4,.3),M(0x6d6558),Math.cos(a)*5.5,1.6,Math.sin(a)*5.5).rotation.y=-a+1.57}
for(let i=0;i<8;i++){const a=i/8*6.283;tiang(Math.cos(a)*13,Math.sin(a)*13)}
for(let i=0;i<20;i++){const a=i/20*6.283;tree(Math.cos(a)*24,Math.sin(a)*24)}}},
{id:'gresik',n:'Alun-Alun Gresik',l:'Gresik, Jawa Timur',d:'Ruang terbuka hijau di pusat Kota Gresik untuk berolahraga, berkumpul, dan bersantai. Model ini hanya representasi sederhana, bukan tata letak aslinya.',dist:62,ty:5,mr:6,wr:40,
build(){ground(0x6fb35a,50);
mesh(new T.CylinderGeometry(19,19,.12,48),M(0x86c96f,{roughness:1}),0,.06,0);
const tr=mesh(new T.RingGeometry(19,22.5,64),new T.MeshStandardMaterial({color:0xb5563a,roughness:1,side:T.DoubleSide}),0,.14,0);tr.rotation.x=-Math.PI/2;
mesh(new T.CylinderGeometry(5,5.2,.6,32),M(0xcfcac0),0,.3,0);mesh(new T.CylinderGeometry(4.6,4.6,.62,32),M(0x4aa8d8,{roughness:.05,metalness:.5}),0,.31,0);
mesh(new T.CylinderGeometry(.5,.8,4,16),M(0xe8e2d4),0,2.6,0);mesh(new T.CylinderGeometry(1.8,1.2,.4,20),M(0xe8e2d4),0,4.6,0);
mesh(new T.ConeGeometry(.9,3,16),new T.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.55}),0,6.3,0);
const g=M(0xe6c25a,{roughness:.5});
for(const s of[-1,1])mesh(new T.BoxGeometry(2,9,2),M(0xf1ead6),s*6,4.5,36);
mesh(new T.BoxGeometry(16,1.8,2.2),M(0xf1ead6),0,9.5,36);mesh(new T.BoxGeometry(17,.6,3),g,0,10.7,36);
label('ALUN-ALUN GRESIK',12,3,0,9.5,37.15);
const cr=M(0xf3ead2);mesh(new T.BoxGeometry(22,7,11),cr,0,3.5,-38);mesh(new T.BoxGeometry(23,.5,12),M(0x2e8b57),0,7.2,-38);
mesh(new T.SphereGeometry(4.5,24,12,0,6.283,0,1.57),M(0x2e8b57,{metalness:.3}),0,7.4,-38);
for(const s of[-1,1]){mesh(new T.CylinderGeometry(.9,1.1,18,14),cr,s*13,9,-38);mesh(new T.SphereGeometry(1.1,12,8,0,6.283,0,1.57),M(0x2e8b57),s*13,18,-38)}
for(let i=0;i<24;i++){const a=i/24*6.283;tree(Math.cos(a)*27,Math.sin(a)*27,1.1)}
for(let i=0;i<12;i++){const a=i/12*6.283;tiang(Math.cos(a)*18,Math.sin(a)*18)}}}
];
function tree(x,z,s=1){mesh(new T.CylinderGeometry(.25*s,.35*s,2*s,6),M(0x6b4a2a),x,s,z);mesh(new T.SphereGeometry(1.4*s,10,8),M(0x2f7a3a),x,2.6*s,z)}
function tiang(x,z){mesh(new T.CylinderGeometry(.08,.1,3.2,6),M(0x333333),x,1.6,z);mesh(new T.SphereGeometry(.28,8,6),new T.MeshBasicMaterial({color:0xfff2b0}),x,3.3,z)}
function label(t,w,h,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');g.fillStyle='#1b5e3b';g.fillRect(0,0,512,128);g.fillStyle='#fff';g.font='bold 54px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,256,66);const m=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide}));m.position.set(x,y,z);cur.add(m)}
const nav=document.getElementById('nav');
let group=null,spawn=1,active=-1;
L.forEach((o,i)=>{const b=document.createElement('button');b.textContent=o.n;b.onclick=()=>pick(i);nav.appendChild(b);o.btn=b});
function pick(i){if(i===active)return;active=i;
if(group)scene.remove(group);group=new T.Group();cur=group;L[i].build();cur=null;scene.add(group);spawn=0;
L.forEach((o,j)=>o.btn.classList.toggle('on',j===i));
nm.textContent=L[i].n;loc.textContent=L[i].l;ds.textContent=L[i].d;tgt.dist=L[i].dist;tgt.ty=L[i].ty;resetWalk()}
// kamera orbit
const st={th:.8,ph:1.15,dist:50,ty:10},tgt={dist:50,ty:10};let auto=true,night=0,nTarget=0;
const el=renderer.domElement,ptr=new Map();let pd=0;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2)pd=pdist()});
el.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
if(ptr.size==1){if(W.on){W.yaw-=(e.clientX-p[0])*.005;W.pitch=Math.max(-1.2,Math.min(1.2,W.pitch+(e.clientY-p[1])*.004))}else{st.th-=(e.clientX-p[0])*.006;st.ph=Math.max(.15,Math.min(1.5,st.ph-(e.clientY-p[1])*.006))}}
ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const d=pdist();tgt.dist=Math.max(12,Math.min(110,tgt.dist*pd/d));pd=d}});
const up=e=>ptr.delete(e.pointerId);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',e=>{e.preventDefault();tgt.dist=Math.max(12,Math.min(110,tgt.dist*(1+e.deltaY*.001)))},{passive:false});
function pdist(){const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1}
bAuto.onclick=()=>{auto=!auto;bAuto.classList.toggle('on',auto)};
const W={x:0,z:30,yaw:0,pitch:.1,on:false,k:{},jx:0,jy:0},hintOrbit=hintEl.textContent;
function resetWalk(){W.x=0;W.z=Math.min(tgt.dist*.5,(L[active].wr||32)-2);W.yaw=0;W.pitch=.15}
addEventListener('keydown',e=>W.k[e.key.toLowerCase()]=1);addEventListener('keyup',e=>W.k[e.key.toLowerCase()]=0);
bWalk.onclick=()=>{W.on=!W.on;bWalk.classList.toggle('on',W.on);bWalk.textContent=W.on?'🔭 Mode Orbit':'🚶 Mode Jalan';joy.style.display=W.on?'block':'none';
hintEl.textContent=W.on?'WASD / panah atau joystick untuk berjalan · seret untuk menoleh · Shift untuk berlari':hintOrbit;
cam.fov=W.on?70:50;cam.updateProjectionMatrix();if(W.on){auto=false;bAuto.classList.remove('on');resetWalk()}};
const jb=joy.firstElementChild;
function jm(e){const r=joy.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}W.jx=x;W.jy=y;jb.style.transform='translate('+x*35+'px,'+y*35+'px)'}
function jr(){W.jx=W.jy=0;jb.style.transform=''}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jm(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))jm(e)});joy.addEventListener('pointerup',jr);joy.addEventListener('pointercancel',jr);
function walkStep(dt){const k=W.k,sp=(k.shift?14:7)*dt,o=L[active];
const f=(k.w||k.arrowup?1:0)-(k.s||k.arrowdown?1:0)-W.jy,s=(k.d?1:0)-(k.a?1:0)+W.jx;
if(k.arrowleft)W.yaw+=dt*1.8;if(k.arrowright)W.yaw-=dt*1.8;
W.x+=(-Math.sin(W.yaw)*f+Math.cos(W.yaw)*s)*sp;W.z+=(-Math.cos(W.yaw)*f-Math.sin(W.yaw)*s)*sp;
const r=Math.hypot(W.x,W.z)||.01,c=Math.min(o.wr||32,Math.max(o.mr||5,r));W.x*=c/r;W.z*=c/r;
const bob=Math.abs(f)+Math.abs(s)>.1?Math.sin(clock.elapsedTime*9)*.05:0;
cam.position.set(W.x,1.7+bob,W.z);
cam.lookAt(W.x-Math.sin(W.yaw)*Math.cos(W.pitch),1.7+Math.sin(W.pitch),W.z-Math.cos(W.yaw)*Math.cos(W.pitch))}
bNight.onclick=()=>{nTarget=nTarget?0:1;bNight.classList.toggle('on',!!nTarget);bNight.textContent=nTarget?'☀️ Mode Siang':'🌙 Mode Malam'};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const clock=new T.Clock(),c1=new T.Color();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(auto&&!ptr.size)st.th+=dt*.25;
st.dist+=(tgt.dist-st.dist)*.08;st.ty+=(tgt.ty-st.ty)*.06;
night+=(nTarget-night)*.04;
if(group&&spawn<1){spawn=Math.min(1,spawn+dt*1.4);const e=1-Math.pow(1-spawn,3),s0=group.userData.s||(group.userData.s=group.scale.x);group.scale.setScalar(s0*e);group.rotation.y=(1-e)*1.5}
if(W.on)walkStep(dt);else cam.position.set(st.dist*Math.sin(st.ph)*Math.sin(st.th),st.ty*.4+st.dist*Math.cos(st.ph),st.dist*Math.sin(st.ph)*Math.cos(st.th));
if(!W.on)cam.lookAt(0,st.ty*.7,0);
c1.copy(daySky).lerp(nightSky,night);scene.background.copy(c1);scene.fog.color.copy(c1);
sun.intensity=1-night*.85;amb.intensity=.7-night*.5;lamp.intensity=night*1.6;stars.material.opacity=night;
clouds.children.forEach((c,i)=>{c.position.x+=dt*(.8+i*.1);if(c.position.x>90)c.position.x=-90;c.children.forEach(s=>s.material.opacity=.85-night*.7)});
renderer.render(scene,cam)}
pick(0);loop();
</script>
